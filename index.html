<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Céline</title>
<meta name="theme-color" content="#e8779c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Céline">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{--bg:#fff5f8;--card:#fff;--ink:#4a3940;--mut:#a08c94;--pri:#e8779c;--pri2:#fbd9e4;--pri3:#fff0f5;--ok:#6cc39b;--line:#f3dfe7;--sh:0 4px 18px rgba(232,119,156,.13)}
@media (prefers-color-scheme:dark){:root{--bg:#1f1a1d;--card:#2b2428;--ink:#f6e9ee;--mut:#b49fa8;--pri:#f08fb0;--pri2:#4a3440;--pri3:#352a30;--line:#3d3237;--sh:0 4px 18px rgba(0,0,0,.3)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:var(--ink);background:var(--pri3);border:2px solid transparent;border-radius:14px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--pri2)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 4px}
header h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px}
header h1 span{color:var(--pri)}
#sy{font-size:13px;font-weight:700;color:var(--mut);vertical-align:middle;letter-spacing:0}
.code{font:700 17px ui-monospace,Menlo,monospace;background:var(--pri3);border-radius:12px;padding:10px;text-align:center;letter-spacing:1px;user-select:all;overflow-wrap:anywhere}
.gear{font-size:22px;width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--sh)}
main{padding:8px 16px 20px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:22px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.card h2{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.card h2 small{margin-left:auto;font-weight:600;color:var(--mut);font-size:13px}
.hero{background:linear-gradient(135deg,#f7a9c4,#e8779c);color:#fff;border-radius:26px;padding:20px;margin:8px 0 12px;box-shadow:var(--sh)}
.hero .hi{font-size:24px;font-weight:800}
.hero .date{opacity:.9;text-transform:capitalize;margin-top:2px}
.hero .quote{margin-top:12px;background:rgba(255,255,255,.2);border-radius:14px;padding:10px 12px;font-size:14.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{margin:0}
.big{font-size:30px;font-weight:800;color:var(--pri)}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item .e{font-size:22px;width:28px;text-align:center}
.item.done .t{text-decoration:line-through;color:var(--mut)}
.item.done .e{opacity:.5}
.ck{width:28px;height:28px;flex:none;border-radius:50%;border:2.5px solid var(--pri2);display:grid;place-items:center;font-size:15px;color:transparent;transition:.15s}
.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.x{width:32px;height:32px;flex:none;border-radius:50%;color:var(--mut);font-size:18px}
.rep{font-size:12px;color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--sh);font-size:14.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--pri);color:#fff}
.chip .n{display:inline-block;min-width:18px;margin-left:4px;font-size:12px;opacity:.75}
.bar{height:10px;border-radius:9px;background:var(--pri2);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f7a9c4,var(--pri));border-radius:9px;transition:width .4s}
.cat{font-size:13px;font-weight:800;color:var(--pri);text-transform:uppercase;letter-spacing:.6px;margin:14px 4px 0}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.empty b{display:block;font-size:40px;margin-bottom:6px}
.btn{background:var(--pri);color:#fff;font-weight:700;border-radius:16px;padding:13px 18px;flex:1}
.btn.soft{background:var(--pri2);color:var(--ink)}
.btn.del{background:transparent;color:#d9534f;flex:none}
.addrow{display:flex;gap:8px}
.addrow button{flex:none;width:52px;border-radius:14px;background:var(--pri);color:#fff;font-size:26px;font-weight:700}
.meal{display:grid;grid-template-columns:44px 1fr 40px;gap:8px;align-items:center;margin:6px 0}
.meal input{padding:10px 12px}
.meal .lb{font-size:13px;color:var(--mut);font-weight:700}
.dice{font-size:20px;height:40px;border-radius:12px;background:var(--pri3)}
.today{outline:2.5px solid var(--pri);outline-offset:-2.5px}
.ev{display:flex;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .d{width:52px;flex:none;text-align:center;background:var(--pri3);border-radius:14px;padding:6px 0;line-height:1.1}
.ev .d b{display:block;font-size:20px;color:var(--pri)}
.ev .d span{font-size:12px;text-transform:uppercase;color:var(--mut);font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:9px;background:var(--pri2);margin-top:3px}
.tag.now{background:var(--pri);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(232,119,156,.12);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;font-weight:700;color:var(--mut);padding:4px 0;border-radius:14px}
nav button b{font-size:22px;filter:grayscale(.7);opacity:.7;transition:.15s}
nav button.on{color:var(--pri)}
nav button.on b{filter:none;opacity:1;transform:translateY(-2px) scale(1.12)}
#fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--pri);color:#fff;font-size:34px;box-shadow:0 8px 22px rgba(232,119,156,.45);display:none;align-items:center;justify-content:center;z-index:6}
#ov{position:fixed;inset:0;background:rgba(60,30,45,.35);opacity:0;pointer-events:none;transition:.2s;z-index:10}
#ov.on{opacity:1;pointer-events:auto}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .25s,visibility .25s;z-index:11;max-width:640px;margin:0 auto}
#sh.on{transform:none;visibility:visible}
#sh:before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
#sh h3{margin:0 0 12px;font-size:20px}
.lbl{font-size:13px;font-weight:800;color:var(--mut);margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.5px}
.tog{display:flex;align-items:center;gap:10px;margin:16px 2px;font-weight:600}
.tog input{width:22px;height:22px;accent-color:var(--pri)}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:700;transition:.3s;z-index:20;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
#upd{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:9;display:none;gap:10px;align-items:center;background:var(--pri);color:#fff;padding:14px 14px 14px 16px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}#upd.on{display:flex}#upd>div{flex:1;line-height:1.3}#upd small{display:block;opacity:.9;font-size:13px}#upd button{background:#fff;color:var(--pri);font-weight:800;border-radius:12px;padding:10px 14px;white-space:nowrap}
#ins{position:fixed;inset:0;z-index:30;background:linear-gradient(160deg,#fde3ec,#fff5f8 55%);color:#4a3940;display:none;flex-direction:column;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));overflow:auto}
#ins.on{display:flex}#insc{max-width:460px;margin:0 auto;width:100%}
#ins h2{font-size:28px;margin:0 0 10px}#ins p{font-size:17px;margin:0 0 16px}
#ins .btn{display:block;width:100%;font-size:18px;padding:16px;margin:8px 0}
#ins .st{display:flex;gap:14px;align-items:center;background:#fff;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 4px 18px rgba(232,119,156,.15);font-size:17px}
#ins .st .num{font-weight:800;flex:none;width:36px;height:36px;border-radius:50%;background:#e8779c;color:#fff;display:grid;place-items:center;font-size:18px}
#ins .later{margin:18px auto 0;color:#a08c94;font-weight:700;padding:10px}
#ins .arrow{text-align:center;font-size:40px;animation:bob 1s infinite alternate}@keyframes bob{to{transform:translateY(10px)}}
textarea{min-height:90px;resize:vertical}
.link{color:var(--pri);font-weight:700;font-size:14px}
.ring{flex:none}
.cal-h{display:flex;align-items:center;justify-content:space-between}
.cal-h b{font-size:19px;text-transform:capitalize}
.nb{width:42px;height:42px;border-radius:50%;background:var(--pri3);font-size:24px;font-weight:700;color:var(--pri)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.cal .wd{text-align:center;font-size:12px;font-weight:800;color:var(--mut);padding:2px 0 4px}
.cal .c{min-height:48px;border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:6px 0 2px;font-weight:700;font-size:15px}
.cal .c.td{background:var(--pri3);color:var(--pri);box-shadow:inset 0 0 0 2px var(--pri)}
.cal .c.sel{background:var(--pri);color:#fff;box-shadow:none}
.cal .dots{font-size:12px;line-height:1.2;margin-top:2px;min-height:14px}
.ring text{font-weight:800;fill:var(--ink)}
</style>
</head>
<body>
<header><h1>Céline <span>✿</span> <small id="sy" onclick="settings()"></small></h1><button class="gear" onclick="settings()" aria-label="Réglages">⚙️</button></header>
<main id="main"></main>
<button id="fab" onclick="fab()" aria-label="Ajouter">+</button>
<nav>
  <button data-t="home" onclick="go('home')"><b>🏠</b>Accueil</button>
  <button data-t="menage" onclick="go('menage')"><b>🧹</b>Ménage</button>
  <button data-t="courses" onclick="go('courses')"><b>🛒</b>Courses</button>
  <button data-t="repas" onclick="go('repas')"><b>🍽️</b>Repas</button>
  <button data-t="agenda" onclick="go('agenda')"><b>📅</b>Agenda</button>
</nav>
<div id="ov" onclick="closeSheet()"></div>
<div id="sh"></div>
<div id="toast"></div>
<div id="ins"><div id="insc"></div><button class="later" onclick="insLater()">Plus tard</button></div>
<div id="upd"><div><b>🎉 Nouvelle mise à jour disponible</b><small id="updn"></small></div><button onclick="location.reload()">Mettre à jour</button></div>
<input type="file" id="file" accept=".json,application/json" hidden onchange="restore(this)">
<script>
// ---------- Outils ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const todayI=()=>(new Date().getDay()+6)%7;
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const day0=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
function weekKey(){const d=day0(new Date());d.setDate(d.getDate()-todayI());return ymd(d)}
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}};

// ---------- Idées ----------
const SUG=[['🧹','Passer l\'aspirateur'],['🪣','Laver le sol'],['🪶','Faire la poussière'],['🛁','Nettoyer la salle de bain'],['🚽','Nettoyer les toilettes'],['🛏️','Changer les draps'],['🧺','Faire une lessive'],['👕','Repassage'],['🪟','Laver les vitres'],['🗑️','Sortir les poubelles'],['🧊','Nettoyer le frigo'],['🍳','Nettoyer la cuisine'],['🪴','Arroser les plantes'],['♻️','Trier le recyclage'],['🧽','Nettoyer le four'],['🛋️','Ranger le salon'],['👟','Ranger l\'entrée'],['🐾','Litière / animaux']];
const CATS=[
 ['Fruits & légumes','🥦','pomme banane poire orange citron fraise raisin kiwi melon pêche abricot fruit légume salade tomate carotte courgette poivron oignon ail échalote pomme de terre patate brocoli chou épinard concombre champignon poireau avocat aubergine haricot persil basilic herbe laitue framboise myrtille mangue ananas betterave radis céleri navet chicon endive fenouil courge potiron clémentine mandarine prune cerise noix'],
 ['Boulangerie','🥖','pain baguette croissant brioche biscotte pain de mie viennoiserie'],
 ['Viande & poisson','🥩','viande poulet boeuf bœuf porc jambon steak haché saucisse lardon dinde poisson saumon thon crevette cabillaud charcuterie'],
 ['Crèmerie','🧀','lait beurre fromage yaourt yogourt crème oeuf œuf oeufs œufs emmental mozzarella gruyère dessert lacté'],
 ['Épicerie','🍝','pâtes riz farine sucre sel poivre huile vinaigre sauce conserve céréale café thé chocolat biscuit confiture miel épice moutarde ketchup mayonnaise semoule lentille gâteau chips bonbon soupe bouillon olive compote cornichon thon chocolat tartiner'],
 ['Boissons','🥤','eau jus soda coca bière vin sirop limonade'],
 ['Surgelés','🧊','surgelé glace pizza frites'],
 ['Hygiène & beauté','🧴','shampoing shampooing gel douche savon dentifrice brosse déodorant coton maquillage crème visage rasoir mouchoir serviette hygiénique tampon'],
 ['Maison & entretien','🧽','papier toilette essuie-tout sac poubelle lessive adoucissant liquide vaisselle éponge javel nettoyant ampoule pile aluminium allumette bougie sopalin'],
 ['Bébé & animaux','🍼','couche lingette lait bébé croquette pâtée litière'],
 ['Autre','🛍️','']];
const MEALS=['Pâtes bolognaise','Poulet rôti & pommes de terre','Croque-monsieur & salade','Quiche lorraine','Gratin dauphinois','Saumon & riz','Soupe de légumes','Lasagnes','Chili con carne','Omelette & salade','Boulettes sauce tomate','Raclette','Pizza maison','Stoemp & saucisse','Hachis parmentier','Curry de poulet','Wraps poulet crudités','Carbonnade & frites','Salade composée','Risotto aux champignons','Poisson pané & purée','Tacos maison','Crêpes salées','Vol-au-vent'];
const QUOTES=['Un petit pas chaque jour, et tout avance 🌷','Pense aussi à toi aujourd\'hui 💗','Tu fais déjà beaucoup, sois fière de toi ✨','Une tâche à la fois, tranquillement ☕','La maison n\'a pas besoin d\'être parfaite, elle doit être heureuse 🏡','Prends 5 minutes rien que pour toi aujourd\'hui 🌸','Ce qui est fait n\'est plus à faire 💪','Souris, tu gères ! 😊'];

// ---------- Données ----------
const KEY='celine1';
function def(){
  let n0=0;const t=(e,n,d)=>({id:'d'+(++n0),e,t:n,day:d,rep:true,done:null,u:0});
  return {tasks:[t('🧺','Faire une lessive',0),t('🧹','Passer l\'aspirateur',2),t('🗑️','Sortir les poubelles',3),t('🛁','Nettoyer la salle de bain',4),t('🛏️','Changer les draps',5),t('🪴','Arroser les plantes',7)],
    shop:[],hist:{},meals:{},events:[],memo:'',memoU:0,mu:{},gone:{},name:'Céline',fam:''};
}
let st=(()=>{try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.tasks)return Object.assign(def(),s)}catch(e){}return def()})();
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function save(){saveLocal();clearTimeout(pushT);pushT=setTimeout(sync,600)}
let pushT;
const gone=id=>{st.gone[id]=Date.now()};
const who=()=>esc(st.name||'Céline');
// Nouvelle semaine : les tâches répétées repartent à zéro, les tâches uniques déjà faites disparaissent.
function tidy(){
  const wk=weekKey();
  st.tasks=st.tasks.filter(t=>{const k=t.rep||!t.done||t.done===wk;if(!k)gone(t.id);return k});
  if(st.mealWeek&&st.mealWeek!==wk&&st.mealsAuto)emptyMeals();
  st.mealWeek=wk;
  const yest=ymd(new Date(Date.now()-92*864e5));
  st.events=st.events.filter(e=>{const k=e.yearly||e.date>=yest;if(!k)gone(e.id);return k});
  const old=Date.now()-60*864e5;for(const k in st.gone)if(st.gone[k]<old)delete st.gone[k];
  saveLocal();
}
function emptyMeals(){const n=Date.now();for(let d=0;d<7;d++)for(const k of['m','s'])st.mu[d+k]=n;st.meals={}}
tidy();
const isDone=t=>t.done===weekKey();

// ---------- Navigation ----------
let tab='home',dayF=todayI(),ed={};
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#main').innerHTML=V[tab]();
  $('#fab').style.display=(tab==='menage'||tab==='agenda')?'flex':'none';
}
function fab(){tab==='menage'?taskSheet():evSheet()}
function sheet(h){$('#sh').innerHTML=h;$('#sh').classList.add('on');$('#ov').classList.add('on');$('#sh').scrollTop=0}
function closeSheet(){$('#sh').classList.remove('on');$('#ov').classList.remove('on')}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}

function ring(p,size=64){const r=size/2-6,c=2*Math.PI*r;
  return `<svg class="ring" width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--pri2)" stroke-width="7"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--pri)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-size="${size/4.2}">${Math.round(p*100)}%</text></svg>`}

// ---------- Ménage ----------
function taskRow(t,showDay){
  return `<div class="item ${isDone(t)?'done':''}"><button class="ck" onclick="toggleTask('${t.id}')" aria-label="Fait">✓</button><span class="e">${esc(t.e)}</span><span class="t" onclick="taskSheet('${t.id}')">${esc(t.t)}${t.rep?' <span class="rep">🔁</span>':''}${showDay?` <span class="rep">· ${t.day<7?DAYS[t.day]:'Semaine'}</span>`:''}</span><button class="x" onclick="askDelTask('${t.id}')" aria-label="Supprimer">🗑️</button></div>`}
function askDelTask(id){ed={id};delTask()}
function toggleTask(id){
  const t=st.tasks.find(x=>x.id===id);if(!t)return;
  t.done=isDone(t)?null:weekKey();t.u=Date.now();buzz();save();render();
  if(t.done){const list=st.tasks.filter(x=>x.day===t.day);
    if(list.every(isDone))toast(t.day===7?'Toutes les tâches de la semaine sont faites ! 🎉':'Bravo '+(st.name||'Céline')+', tout est fait pour '+DAYS[t.day].toLowerCase()+' ! 🎉');}
}
function taskSheet(id){
  const t=id?st.tasks.find(x=>x.id===id):{e:'🧹',t:'',day:dayF,rep:true};
  ed={id:id||'',e:t.e,day:t.day};
  sheet(`<h3>${id?'Modifier la tâche':'Nouvelle tâche'}</h3>
  <div class="row"><button class="chip" style="font-size:22px;padding:8px 12px" id="fe">${esc(t.e)}</button><input id="ft" value="${esc(t.t)}" placeholder="Ex : Passer l'aspirateur" oninput="guessEmoji(this.value)"></div>
  ${id?'':`<div class="lbl">Idées</div><div class="chips">${SUG.map((s,i)=>`<button class="chip" onclick="pickSug(${i})">${s[0]} ${esc(s[1])}</button>`).join('')}</div>`}

// ---------- Courses ----------
function catOf(name){const n=' '+name.toLowerCase().replace(/['’\-]/g,' ')+' ';
  let best=CATS.length-1,len=0;
  CATS.forEach((c,i)=>c[2].split(' ').forEach(k=>{if(k&&n.includes(' '+k)&&k.length>len){best=i;len=k.length}}));
  return best}
function addItem(name){
  name=(name||'').trim();if(!name)return;
  const ex=st.shop.find(i=>i.t.toLowerCase()===name.toLowerCase());
  if(ex){ex.done=false;ex.u=Date.now()}else st.shop.push({id:uid(),t:name,c:catOf(name),done:false,u:Date.now()});
  const k=name.toLowerCase();st.hist[k]=(st.hist[k]||0)+1;
  buzz();save();render();
  const i=$('#ni');if(i){i.focus()}
}
function toggleItem(id){const i=st.shop.find(x=>x.id===id);i.done=!i.done;i.u=Date.now();buzz();save();render()}
function delItem(id){gone(id);st.shop=st.shop.filter(x=>x.id!==id);save();render()}
function clearTaken(){st.shop=st.shop.filter(x=>{if(x.done)gone(x.id);return !x.done});save();render();toast('Articles pris retirés 🧺')}
function shareList(){
  const left=st.shop.filter(i=>!i.done);if(!left.length){toast('La liste est vide');return}
  let txt='🛒 Liste de courses\n';
  CATS.forEach((c,ci)=>{const l=left.filter(i=>i.c===ci);if(l.length)txt+='\n'+c[1]+' '+c[0]+'\n'+l.map(i=>'• '+i.t).join('\n')+'\n'});
  if(navigator.share)navigator.share({text:txt}).catch(()=>{});
  else navigator.clipboard.writeText(txt).then(()=>toast('Liste copiée 📋'),()=>toast('Impossible de copier'));
}

function nextOcc(e){
  const t=day0(new Date());

}

function restore(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.tasks)throw 0;const fam=st.fam,name=st.name;st=Object.assign(def(),s,{fam,name});tidy();save();closeSheet();render();toast('Données restaurées ✅')}catch(e){toast('Fichier non reconnu ❌')}inp.value=''};
  r.readAsText(f);
}
function wipe(){if(confirm('Effacer toutes les listes ? Elles seront aussi effacées sur l\'autre téléphone. Cette action est définitive.')){const g={...st.gone},n=Date.now();[...st.tasks,...st.shop,...st.events].forEach(x=>g[x.id]=n);const nm=st.name;st=def();st.name=nm;st.tasks.forEach(x=>g[x.id]=n);st.tasks=[];st.gone=g;st.memoU=n;emptyMeals();save();closeSheet();go('home');toast('Tout est remis à zéro')}}

// ---------- Installation ----------
// Le lien peut s'ouvrir n'importe où (WhatsApp, Messenger, Safari, Chrome…) : un grand écran guide pas à pas.
let dp=null;
const UA=navigator.userAgent;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isAndroid=/Android/i.test(UA);
const inApp=()=>/; wv\)|FBAN|FBAV|FB_IAB|Messenger|Instagram|WhatsApp|Snapchat|musical_ly|TikTok|Line\/|GSA\/|LinkedInApp|Twitter/.test(UA);
const appName=()=>/WhatsApp/.test(UA)?'WhatsApp':/Messenger|FBAN|FBAV|FB_IAB/.test(UA)?'Messenger / Facebook':/Instagram/.test(UA)?'Instagram':/Snapchat/.test(UA)?'Snapchat':'cette application';
const iosOther=()=>isIOS&&/CriOS|FxiOS|EdgiOS|OPiOS/.test(UA);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if($('#ins').classList.contains('on'))showIns(1);else if(tab==='home')render()});
addEventListener('appinstalled',()=>{dp=null;hideIns();toast('Céline est installée 🎉');render()});
function install(){if(!dp)return;dp.prompt();dp.userChoice.then(c=>{if(c&&c.outcome==='accepted')hideIns()}).finally(()=>{dp=null;closeSheet();render()})}
const URL0=()=>location.origin+location.pathname;
function copyLink(){const u=URL0();(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Lien copié ✓ Colle-le dans Safari')).catch(()=>prompt('Copie ce lien :',u))}
function openSafari(){location.href='x-safari-'+URL0();setTimeout(()=>toast('Si rien ne s\'ouvre : suis les étapes ci-dessous'),1500)}
function openChrome(){const u=URL0();location.href='intent://'+u.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(u)+';end'}
const step=(n,h)=>`<div class="st"><span class="num">${n}</span><div>${h}</div></div>`;
function insHTML(){
  if(inApp()&&isIOS)return `<h2>Encore une petite étape 🌸</h2><p>Le lien s'est ouvert dans <b>${appName()}</b>. Pour installer Céline, il faut l'ouvrir dans <b>Safari</b>.</p>
    <button class="btn" onclick="openSafari()">🧭 Ouvrir dans Safari</button>
    <p class="mut" style="margin-top:14px">Si le bouton ne marche pas :</p>
    ${step(1,'Touche <b>⋯</b> ou <b>⬆️</b> (en haut ou en bas de l\'écran)')}${step(2,'Choisis <b>« Ouvrir dans Safari »</b> 🧭')}
    <button class="btn soft" onclick="copyLink()">📋 Copier le lien</button>`;
  if(inApp()&&isAndroid)return `<h2>Encore une petite étape 🌸</h2><p>Le lien s'est ouvert dans <b>${appName()}</b>. Pour installer Céline, il faut l'ouvrir dans <b>Chrome</b>.</p>
    <button class="btn" onclick="openChrome()">🌐 Ouvrir dans Chrome</button>
    ${step(1,'Sinon : touche <b>⋮</b> en haut à droite')}${step(2,'Choisis <b>« Ouvrir dans Chrome »</b>')}`;
  if(dp)return `<h2>Installe Céline 🌸</h2><p>Elle sera sur ton écran d'accueil, comme une vraie application.</p><button class="btn" onclick="install()">📲 Installer</button>`;
  if(isIOS)return `<h2>Installe Céline 🌸</h2><p>3 petites étapes et elle sera sur ton écran d'accueil, comme une vraie application :</p>
    ${step(1,iosOther()?'Touche le bouton <b>Partager ⬆️</b> (dans la barre d\'adresse)':'Touche le bouton <b>Partager ⬆️</b> en bas de l\'écran<br><span class="mut">(ou <b>⋯</b> en bas à droite, puis <b>Partager</b>)</span>')}
    ${step(2,'Fais défiler et touche <b>« Sur l\'écran d\'accueil »</b> ➕')}
    ${step(3,'Touche <b>« Ajouter »</b> en haut à droite')}
    <p class="mut">Ensuite, ouvre Céline depuis l'icône rose sur ton écran 🌸</p>${iosOther()?'':'<div class="arrow">⬇️</div>'}`;
  if(isAndroid)return `<h2>Installe Céline 🌸</h2>${step(1,'Touche <b>⋮</b> en haut à droite de Chrome')}${step(2,'Choisis <b>« Installer l\'application »</b> ou <b>« Ajouter à l\'écran d\'accueil »</b>')}
    <button class="btn soft" onclick="openChrome()">🌐 Pas dans le menu ? Ouvrir dans Chrome</button>`;
  return `<h2>Céline 🌸</h2><p>Ouvre ce lien sur ton téléphone pour installer Céline.</p><button class="btn soft" onclick="copyLink()">📋 Copier le lien</button>`;
}
function showIns(force){if(standalone())return;
  if(!force){try{if(Date.now()-(+localStorage.getItem('celine-ins')||0)<864e5)return}catch(e){}}
  $('#insc').innerHTML=insHTML();$('#ins').classList.add('on')}
function hideIns(){$('#ins').classList.remove('on')}
function insLater(){try{localStorage.setItem('celine-ins',Date.now())}catch(e){}hideIns()}
function installHelp(){return standalone()?'Céline est déjà installée sur ton écran d\'accueil ✅':'<button class="btn soft" onclick="closeSheet();showIns(1)">📲 Comment installer Céline</button>'}
function installBanner(){if(standalone()||st.noBanner)return '';
  return `<div class="card" style="display:flex;gap:12px;align-items:center" onclick="showIns(1)"><span style="font-size:30px">📲</span><div style="flex:1"><b>Installe Céline</b><div class="mut">Touche ici pour voir comment</div></div><button class="x" onclick="event.stopPropagation();st.noBanner=1;saveLocal();render()">✕</button></div>`}

// Au retour sur l'appli (le lendemain, nouvelle semaine…), tout se remet à jour.
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tidy();if(!$('#sh').classList.contains('on')&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){dayF=tab==='menage'?dayF:todayI();render()}}});

// Version de l'appli : à changer à chaque mise à jour, avec la même valeur dans version.json.
const APPV='2026-10-31.10';
let SWR=null;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v='+APPV).then(r=>{SWR=r}).catch(()=>{});
// Nouvelle version publiée ? On affiche « Nouvelle mise à jour disponible ».
function chkV(man){if(SWR)SWR.update().catch(()=>{});
  fetch('version.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
    if(!j||!j.v||j.v===APPV){if(man)toast('Céline est à jour ✓');return}
    if(man)closeSheet();$('#updn').textContent=j.notes||'';$('#upd').classList.add('on')}).catch(()=>{if(man)toast('Pas de connexion')})}
try{const o=localStorage.getItem('celine-v');localStorage.setItem('celine-v',APPV);if(o&&o!==APPV)setTimeout(()=>toast('Céline a été mise à jour ✨'),600)}catch(e){}
chkV();setInterval(chkV,30*60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)chkV()});

// ---------- Partage entre les téléphones de la famille (Firebase Realtime Database) ----------
// Tous les téléphones qui ouvrent l'appli partagent les mêmes listes : FB/familles/FAM.json.
// Chaque élément porte sa date de modification (u) ; les suppressions sont notées dans `gone`.
// La fusion garde toujours la version la plus récente : rien ne se perd si les deux modifient en même temps.
const FB='https://celine-fcdb2-default-rtdb.europe-west1.firebasedatabase.app';
const FAM='mk4tq-zr8wd-h3pxn-97cfa';
const hk=k=>'k'+encodeURIComponent(k).replace(/\./g,'%2E');
function norm(x){
  if(x===null||x===undefined||x==='')return undefined;
  if(typeof x!=='object')return x;
  const o={};Object.keys(x).sort().forEach(k=>{const v=norm(x[k]);if(v!==undefined&&!(typeof v==='object'&&!Object.keys(v).length))o[k]=v});return o;
}
const asMap=a=>{const o={};(a||[]).forEach(x=>{if(x&&x.id)o[x.id]=x});return o};
function pack(s){
  const meals={};for(let d=0;d<7;d++)for(const k of['m','s']){const u=s.mu[d+k]||0,v=(s.meals[d]||{})[k]||'';if(u||v)meals[d+k]={v,u}}
  const hist={};for(const k in s.hist)hist[hk(k)]=s.hist[k];
  return norm({tasks:asMap(s.tasks),shop:asMap(s.shop),events:asMap(s.events),meals,memo:{v:s.memo||'',u:s.memoU||0},hist,gone:s.gone})||{};
}
function merge(a,b){
  a=a||{};b=b||{};const g={...(a.gone||{})};for(const k in b.gone||{})g[k]=Math.max(g[k]||0,b.gone[k]);
  const old=Date.now()-60*864e5;for(const k in g)if(g[k]<old)delete g[k];
  const newer=(x,y)=>!x?y:!y?x:((y.u||0)>(x.u||0)?y:x);
  const lst=n=>{const o={...(a[n]||{})};for(const k in b[n]||{})o[k]=newer(o[k],b[n][k]);for(const k in o)if(g[k]!==undefined&&g[k]>=(o[k].u||0))delete o[k];return o};
  const meals={...(a.meals||{})};for(const k in b.meals||{})meals[k]=newer(meals[k],b.meals[k]);
  const hist={...(a.hist||{})};for(const k in b.hist||{})hist[k]=Math.max(hist[k]||0,b.hist[k]);
  return norm({tasks:lst('tasks'),shop:lst('shop'),events:lst('events'),meals,memo:newer(a.memo,b.memo),hist,gone:g})||{};
}
function unpack(m){
  const vals=o=>Object.values(o||{}).sort((x,y)=>x.id<y.id?-1:1);
  st.tasks=vals(m.tasks).map(t=>({done:null,...t}));st.shop=vals(m.shop).map(i=>({done:false,...i}));st.events=vals(m.events).map(e=>({time:'',yearly:false,...e}));
  st.meals={};st.mu={};for(const k in m.meals||{}){const d=k[0],t=k[1];st.mu[k]=m.meals[k].u||0;if(m.meals[k].v)(st.meals[d]=st.meals[d]||{})[t]=m.meals[k].v}
  st.memo=(m.memo&&m.memo.v)||'';st.memoU=(m.memo&&m.memo.u)||0;
  st.hist={};for(const k in m.hist||{})st.hist[decodeURIComponent(k.slice(1))]=m.hist[k];
  st.gone=m.gone||{};
}
const famURL=()=>FB+'/familles/'+FAM+'.json';
let syncing=false,again=false,syncOK=null,needR=false;
function setSy(t){syncOK=t;const e=$('#sy');if(e)e.textContent=t==='ok'?'☁️ partagé':t==='err'?'⚠️ hors ligne':'☁️ …'}
async function sync(){
  if(syncing){again=true;return}syncing=true;
  try{
    const r=await fetch(famURL(),{cache:'no-store'});if(!r.ok)throw r.status;
    const remote=norm(await r.json())||{},local=pack(st),m=merge(local,remote),ms=JSON.stringify(m);
    if(ms!==JSON.stringify(remote)){const w=await fetch(famURL(),{method:'PUT',body:ms});if(!w.ok)throw w.status}
    // Ce qui a été ajouté pendant l'envoi est gardé (sinon perdu) ; le prochain envoi s'en charge.
    const now=pack(st),m2=JSON.stringify(now)===JSON.stringify(local)?m:merge(now,m);
    if(JSON.stringify(m2)!==JSON.stringify(now)){unpack(m2);tidy();softRender()}
    setSy('ok');
  }catch(e){setSy('err')}
  syncing=false;if(again){again=false;sync()}
}
const typing=()=>{const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&!$('#sh').contains(a)};
function softRender(){const a=document.activeElement;if(a&&a.id==='ni'){const v=a.value;render();const n=$('#ni');if(n){n.value=v;n.focus()}return}if(typing())needR=true;else render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(needR&&!typing()){needR=false;render()}},250));
// Écoute en direct : dès que l'autre téléphone change quelque chose, on récupère.
let es=null,esT;
function startStream(){stopStream();if(!window.EventSource)return;
  try{es=new EventSource(famURL());const on=()=>{clearTimeout(esT);esT=setTimeout(sync,300)};es.addEventListener('put',on);es.addEventListener('patch',on)}catch(e){}}
function stopStream(){if(es){es.close();es=null}}
function shareBlock(){
  return `<div class="lbl">👫 Partage ${syncOK==='ok'?'actif ✅':syncOK==='err'?'(pas de connexion) ⚠️':''}</div>
    <p class="mut">Tout le monde qui ouvre Céline voit les mêmes listes. Pour l'installer sur un autre téléphone, envoie le lien.</p>
    <div class="row"><button class="btn" onclick="sendApp()">📤 Envoyer le lien de l'appli</button></div>`;
}
function sendApp(){const u=location.origin+location.pathname,txt='🌸 Notre appli Céline (courses, ménage, repas, agenda) : '+u;
  if(navigator.share)navigator.share({text:txt}).catch(()=>{});else navigator.clipboard.writeText(u).then(()=>toast('Lien copié 📋'),()=>prompt('Copie ce lien :',u))}
setSy('');startStream();sync();

// ---------- Notifications d'anniversaire ----------
// Le téléphone s'abonne (Web Push) ; l'abonnement est rangé dans FB/familles/FAM-push/.
// Chaque matin, GitHub Actions (scripts/anniversaires.js) lit l'agenda et envoie la notification.
const VAPID='BFTvZTIh2aUkk9nV12w9d9lKZTNCteSiai2ysh2Hk39XvW3q58awzFHLEPRBAqqfaqm4aqNUGeKMjBAv_1BcT7M';
const pushURL=id=>FB+'/familles/'+FAM+'-push/'+id+'.json';
const notifOK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
function b64u(s){const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
function hashStr(s){let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)}
async function notifOn(){
  if(isIOS&&!standalone()){toast('Installe d\'abord Céline sur l\'écran d\'accueil 📲');closeSheet();showIns(1);return}
  if(!notifOK()){toast('Ce téléphone ne permet pas les notifications 😕');return}
  try{
    const p=await Notification.requestPermission();if(p!=='granted'){toast('Notifications refusées. Autorise-les dans les réglages du téléphone.');return}
    const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
    const j=sub.toJSON(),r=await fetch(pushURL(hashStr(j.endpoint)),{method:'PUT',body:JSON.stringify({endpoint:j.endpoint,keys:j.keys,name:st.name||'',t:Date.now()})});
    if(!r.ok)throw r.status;
    st.notif=1;saveLocal();toast('🔔 Notifications activées !');settings();
  }catch(e){toast('Impossible d\'activer les notifications, réessaie plus tard')}
}
async function notifOff(){
  try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
    if(sub){await fetch(pushURL(hashStr(sub.endpoint)),{method:'DELETE'}).catch(()=>{});await sub.unsubscribe()}}catch(e){}
  st.notif=0;saveLocal();toast('🔕 Notifications coupées');settings();
}
function notifBlock(){
  const on=st.notif&&notifOK()&&Notification.permission==='granted';
  return `<div class="lbl">🔔 Notifications</div>
    <p class="mut">Un message le matin quand c'est un anniversaire 🎂, et la veille pour penser au cadeau 🎁.</p>
    <div class="row">${on?'<button class="btn soft" onclick="notifOff()">🔕 Couper les notifications</button>':'<button class="btn" onclick="notifOn()">🔔 Activer les notifications</button>'}</div>`;
}
// Clic sur une notification : ouvrir l'agenda.
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data==='agenda')go('agenda')});
if(location.hash==='#agenda'){tab='agenda';history.replaceState(null,'',location.pathname)}
setInterval(()=>{if(!document.hidden)sync()},30000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopStream();else{startStream();sync()}});
addEventListener('online',()=>sync());
render();setSy(syncOK);setTimeout(()=>showIns(),700);
</script>
