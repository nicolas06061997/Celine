<script>
// ---------- Outils ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const todayI=()=>(new Date().getDay()+6)%7;
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const day0=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
function weekKey(){const d=day0(new Date());d.setDate(d.getDate()-todayI());return ymd(d)}
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}};

// ---------- Idées ----------
const SUG=[['🧹','Passer l\'aspirateur'],['🪣','Laver le sol'],['🪶','Faire la poussière'],['🛁','Nettoyer la salle de bain'],['🚽','Nettoyer les toilettes'],['🛏️','Changer les draps'],['🧺','Faire une lessive'],['👕','Repassage'],['🪟','Laver les vitres'],['🗑️','Sortir les poubelles'],['🧊','Nettoyer le frigo'],['🍳','Nettoyer la cuisine'],['🪴','Arroser les plantes'],['♻️','Trier le recyclage'],['🧽','Nettoyer le four'],['🛋️','Ranger le salon'],['👟','Ranger l\'entrée'],['🐾','Litière / animaux']];
const CATS=[
 ['Fruits & légumes','🥦','pomme banane poire orange citron fraise raisin kiwi melon pêche abricot fruit légume salade tomate carotte courgette poivron oignon ail échalote pomme de terre patate brocoli chou épinard concombre champignon poireau avocat aubergine haricot persil basilic herbe laitue framboise myrtille mangue ananas betterave radis céleri navet chicon endive fenouil courge potiron clémentine mandarine prune cerise noix'],
 ['Boulangerie','🥖','pain baguette croissant brioche biscotte pain de mie viennoiserie'],
 ['Viande & poisson','🥩','viande poulet boeuf bœuf porc jambon steak haché saucisse lardon dinde poisson saumon thon crevette cabillaud charcuterie'],
 ['Crèmerie','🧀','lait beurre fromage yaourt yogourt crème oeuf œuf oeufs œufs emmental mozzarella gruyère dessert lacté'],
 ['Épicerie','🍝','pâtes riz farine sucre sel poivre huile vinaigre sauce conserve céréale café thé chocolat biscuit confiture miel épice moutarde ketchup mayonnaise semoule lentille gâteau chips bonbon soupe bouillon olive compote cornichon thon chocolat tartiner'],
 ['Boissons','🥤','eau jus soda coca bière vin sirop limonade'],
 ['Surgelés','🧊','surgelé glace pizza frites'],
 ['Hygiène & beauté','🧴','shampoing shampooing gel douche savon dentifrice brosse déodorant coton maquillage crème visage rasoir mouchoir serviette hygiénique tampon'],
 ['Maison & entretien','🧽','papier toilette essuie-tout sac poubelle lessive adoucissant liquide vaisselle éponge javel nettoyant ampoule pile aluminium allumette bougie sopalin'],
 ['Bébé & animaux','🍼','couche lingette lait bébé croquette pâtée litière'],
 ['Autre','🛍️','']];
const MEALS=['Pâtes bolognaise','Poulet rôti & pommes de terre','Croque-monsieur & salade','Quiche lorraine','Gratin dauphinois','Saumon & riz','Soupe de légumes','Lasagnes','Chili con carne','Omelette & salade','Boulettes sauce tomate','Raclette','Pizza maison','Stoemp & saucisse','Hachis parmentier','Curry de poulet','Wraps poulet crudités','Carbonnade & frites','Salade composée','Risotto aux champignons','Poisson pané & purée','Tacos maison','Crêpes salées','Vol-au-vent'];
const QUOTES2=['Un petit pas chaque jour, et tout avance 💪','Une tâche à la fois, tranquillement ☕','Ce qui est fait n\'est plus à faire ✅','Bonne journée, champion 👍','Prends 5 minutes pour souffler aujourd\'hui 😌','En équipe, tout va plus vite 🤝','La maison n\'a pas besoin d\'être parfaite 🏡','Allez, on gère ! 🚀'];
const QUOTES=['Un petit pas chaque jour, et tout avance 🌷','Pense aussi à toi aujourd\'hui 💗','Tu fais déjà beaucoup, sois fière de toi ✨','Une tâche à la fois, tranquillement ☕','La maison n\'a pas besoin d\'être parfaite, elle doit être heureuse 🏡','Prends 5 minutes rien que pour toi aujourd\'hui 🌸','Ce qui est fait n\'est plus à faire 💪','Souris, tu gères ! 😊'];

// ---------- Horaire (types de journée de travail) ----------
const SHIFT0=[['🌅','Matin','6h – 14h','#ffe1b3'],['☀️','Journée','8h – 17h','#fff0a6'],['🌇','Après-midi','14h – 22h','#ffc9de'],['🌙','Nuit','22h – 6h','#cfd3ff'],['🏖️','Congé','','#c8f0d8'],['😴','Repos','','#e9e2e6']];
const SCOL=['#ffe1b3','#fff0a6','#ffc9de','#cfd3ff','#c8f0d8','#e9e2e6','#ffd0c2','#d6ecff','#e7d4ff','#d9f2b6'];
const SEMO=['🌅','☀️','🌇','🌙','🏖️','😴','💼','🏥','🏪','🚗','🎓','⭐'];

// ---------- Données ----------
const KEY='celine1';
function def(){
  let n0=0;const t=(e,n,d)=>({id:'d'+(++n0),e,t:n,day:d,rep:true,done:null,u:0});
  return {tasks:[t('🧺','Faire une lessive',0),t('🧹','Passer l\'aspirateur',2),t('🗑️','Sortir les poubelles',3),t('🛁','Nettoyer la salle de bain',4),t('🛏️','Changer les draps',5),t('🪴','Arroser les plantes',7)],
    shop:[],hist:{},meals:{},events:[],memo:'',memoU:0,mu:{},gone:{},name:'Céline',fam:'',
    shifts:SHIFT0.map((x,i)=>({id:'s'+(i+1),e:x[0],n:x[1],h:x[2],c:x[3],u:0})),sched:{},profiles:[],
    dishes:[],lists:[],infos:[],bins:[],msgs:[],fav:{}};
}
let st=(()=>{try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.tasks)return Object.assign(def(),s)}catch(e){}return def()})();
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function save(){saveLocal();clearTimeout(pushT);pushT=setTimeout(sync,600)}
let pushT;
const gone=id=>{st.gone[id]=Date.now()};
const who=()=>esc(st.name||'Céline');
// Nouvelle semaine : les tâches répétées repartent à zéro, les tâches uniques déjà faites disparaissent.
function tidy(){
  const wk=weekKey();
  st.tasks=st.tasks.filter(t=>{const k=t.rep||!t.done||t.done===wk;if(!k)gone(t.id);return k});
  if(st.mealWeek&&st.mealWeek!==wk&&st.mealsAuto)emptyMeals();
  st.mealWeek=wk;
  const yest=ymd(new Date(Date.now()-92*864e5));
  st.events=st.events.filter(e=>{const k=e.yearly||e.date>=yest;if(!k)gone(e.id);return k});
  const old=Date.now()-60*864e5;for(const k in st.gone)if(st.gone[k]<old)delete st.gone[k];
  const so=schedMin();for(const k in st.sched)if(k<so)delete st.sched[k];
  // Petits messages : un coup de pouce ne dure qu'une journée, un petit mot lu disparaît après 30 jours.
  const d3=ymd(new Date(Date.now()-3*864e5)),m30=Date.now()-30*864e5;
  st.msgs=(st.msgs||[]).filter(m=>{const k=m.k==='pouce'?m.d>=d3:!(m.seen&&m.seen<m30);if(!k)gone(m.id);return k});
  saveLocal();
}
const schedMin=()=>ymd(new Date(Date.now()-120*864e5));
function emptyMeals(){const n=Date.now();for(let d=0;d<7;d++)for(const k of['m','s'])st.mu[d+k]=n;st.meals={}}
tidy();
const isDone=t=>t.done===weekKey();

// ---------- Navigation ----------
let tab='home',dayF=todayI(),ed={};
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#main').innerHTML=V[tab]();
  const f=tab==='menage'||tab==='agenda';$('#fab').style.display=f?'flex':'none';document.body.classList.toggle('hasfab',f);
}
function fab(){tab==='menage'?taskSheet():evSheet()}
function sheet(h,keep){const y=$('#sh').scrollTop;$('#sh').innerHTML=h;$('#sh').classList.add('on');$('#ov').classList.add('on');$('#sh').scrollTop=keep?y:0}
function closeSheet(){$('#sh').classList.remove('on');$('#ov').classList.remove('on')}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}

function ring(p,size=64){const r=size/2-6,c=2*Math.PI*r;
  return `<svg class="ring" width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--pri2)" stroke-width="7"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--pri)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-size="${size/4.2}">${Math.round(p*100)}%</text></svg>`}

// ---------- Ménage ----------
// « Qui s'en occupe ? » : t.who/t.whoW/t.wu = pris cette semaine-là (who '-' = personne), t.own = toujours la même personne, t.by = qui l'a cochée.
const whoOf=t=>t.whoW===weekKey()?(t.who==='-'?'':t.who||''):t.own||'';
const profCol=id=>{const p=(st.profiles||[]).find(x=>x.id===id);let c=!p||!p.col||p.col==='rose'?'#e8779c':p.col;while(lum(c)>.6)c=mix(c,'#000000',.12);return c};
function claim(id){const t=st.tasks.find(x=>x.id===id);if(!t||!needMe())return;const mine=whoOf(t)===st.me,now=Date.now();
  Object.assign(t,{who:mine?'-':st.me,whoW:weekKey(),wu:now,u:now});buzz();save();render();
  toast(mine?'Tu ne t\'en occupes plus':'🙋 Tu t\'en occupes : les autres le voient')}
function taskRow(t,showDay){
  const d=isDone(t),w=d?(t.by&&t.byW===weekKey()?t.by:whoOf(t)):whoOf(t),p=w&&(st.profiles||[]).find(x=>x.id===w),me=w===st.me,c=p?profCol(w):'';
  const left=p?`<button class="pst" style="background:${c}" onclick="claim('${t.id}')" aria-label="Qui s'en occupe">${esc((p.name||'?')[0].toUpperCase())}</button>`
    :`<button class="e" onclick="claim('${t.id}')" aria-label="Je m'en occupe">${esc(t.e)}</button>`;
  const lab=p?`<span class="whol" style="color:${c}">${d?'✓ Fait par '+(me?'moi':esc(p.name)):'🙋 '+(me?'Je m\'en occupe':esc(p.name)+' s\'en occupe')}</span>`:'';
  return `<div class="item ${d?'done':''}"><button class="ck" onclick="toggleTask('${t.id}')" aria-label="Fait">✓</button>${left}<span class="t" onclick="taskSheet('${t.id}')">${esc(t.t)}${t.rep?' <span class="rep">🔁</span>':''}${showDay?` <span class="rep">· ${t.day<7?DAYS[t.day]:'Semaine'}</span>`:''}${lab}</span><button class="x" onclick="askDelTask('${t.id}')" aria-label="Supprimer">🗑️</button></div>`}
function askDelTask(id){ed={id};delTask()}
function toggleTask(id){
  const t=st.tasks.find(x=>x.id===id);if(!t)return;
  t.done=isDone(t)?null:weekKey();t.u=Date.now();if(t.done&&st.me){t.by=st.me;t.byW=t.done}buzz();save();render();
  if(t.done){const list=st.tasks.filter(x=>x.day===t.day);
    if(list.every(isDone)){confetti();toast(t.day===7?'Toutes les tâches de la semaine sont faites ! 🎉':'Bravo '+(st.name||'Céline')+', tout est fait pour '+DAYS[t.day].toLowerCase()+' ! 🎉')}}
}
function taskSheet(id){
  const t=id?st.tasks.find(x=>x.id===id):{e:'🧹',t:'',day:dayF<8?dayF:todayI(),rep:true};
  ed={id:id||'',e:t.e,day:t.day,own:t.own||''};
  sheet(`<h3>${id?'Modifier la tâche':'Nouvelle tâche'}</h3>
  <div class="row"><button class="chip" style="font-size:22px;padding:8px 12px" id="fe" onclick="cycEmoji()" aria-label="Changer l'image">${esc(t.e)}</button><input id="ft" value="${esc(t.t)}" placeholder="Ex : Passer l'aspirateur" ${id?'':'oninput="guessEmoji(this.value)"'}></div>
  ${id?'':`<div class="lbl">Idées</div><div class="chips">${SUG.map((s,i)=>`<button class="chip" onclick="pickSug(${i})">${s[0]} ${esc(s[1])}</button>`).join('')}</div>`}
  <div class="lbl">Quel jour ?</div><div class="chips wrap">${[...DAYS,'N\'importe quand'].map((d,i)=>`<button class="chip dch ${i===t.day?'on':''}" onclick="setDay(${i},this)">${i<7?d.slice(0,3)+'.':'🗓️ '+d}</button>`).join('')}</div>
  <label class="tog"><input type="checkbox" id="fr" ${t.rep?'checked':''}> 🔁 Revient chaque semaine</label>
  ${(st.profiles||[]).length?`<div class="lbl">Toujours fait par</div><div class="chips wrap">${[{id:'',name:'Personne en particulier'},...st.profiles].map(p=>`<button class="chip och ${ed.own===p.id?'on':''}" onclick="ed.own='${p.id}';document.querySelectorAll('.och').forEach(x=>x.classList.remove('on'));this.classList.add('on')">${p.id?'🙋 ':''}${esc(p.name)}</button>`).join('')}</div>`:''}
  <div class="row"><button class="btn" onclick="saveTask()">Enregistrer</button>${id?`<button class="btn del" onclick="delTask()">Supprimer</button>`:''}</div>`);
  if(!id)setTimeout(()=>$('#ft').focus(),250);
}
function cycEmoji(){const L=[...new Set(SUG.map(s=>s[0]))];ed.e=L[(L.indexOf(ed.e)+1)%L.length];$('#fe').textContent=ed.e}
function pickSug(i){ed.e=SUG[i][0];$('#fe').textContent=ed.e;$('#ft').value=SUG[i][1]}
function guessEmoji(v){v=v.toLowerCase();const s=SUG.find(s=>s[1].toLowerCase().split(' ').some(w=>w.length>4&&v.includes(w)));if(s){ed.e=s[0];$('#fe').textContent=s[0]}}
function setDay(i,b){ed.day=i;document.querySelectorAll('.dch').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function saveTask(){
  const n=$('#ft').value.trim();if(!n){$('#ft').focus();return}
  const rep=$('#fr').checked;
  if(ed.id){const t=st.tasks.find(x=>x.id===ed.id),o={t:n,e:ed.e,day:ed.day,rep,u:Date.now()};
    if((t.own||'')!==ed.own){o.own=ed.own;o.whoW=''}   // nouveau « toujours fait par » : il remplace ce qui avait été pris cette semaine
    Object.assign(t,o)}
  else st.tasks.push({id:uid(),t:n,e:ed.e,day:ed.day,rep,own:ed.own,done:null,u:Date.now()});
  dayF=ed.day;save();closeSheet();render();
}
function delTask(){gone(ed.id);st.tasks=st.tasks.filter(x=>x.id!==ed.id);save();closeSheet();render();toast('Tâche supprimée')}

// ---------- Courses ----------
function catOf(name){const n=' '+name.toLowerCase().replace(/['’\-]/g,' ')+' ';
  let best=CATS.length-1,len=0;
  CATS.forEach((c,i)=>c[2].split(' ').forEach(k=>{if(k&&n.includes(' '+k)&&k.length>len){best=i;len=k.length}}));
  return best}
// Quantité écrite avec l'article : « lait x2 », « 3x yaourts », « œufs ×6 »
function parseQ(v){v=(v||'').trim();let m=v.match(/^(\d{1,2})\s*(?:x\s|[×*])\s*(.+)$/i);if(m&&+m[1]>0)return {t:m[2].trim(),q:+m[1]};
  m=v.match(/^(.+?)(?:\s+x|\s*[×*])\s*(\d{1,2})$/i);if(m&&+m[2]>0)return {t:m[1].trim(),q:+m[2]};return {t:v,q:0}}
const qOf=i=>i.q>1?`<span class="qt">×${i.q}</span>`:'';
// Ajoute un article. inc : s'il est déjà dans la liste, on en ajoute un de plus (lait → lait ×2).
function shopAdd(raw,inc){
  const {t,q}=parseQ(raw);if(!t)return null;const now=Date.now(),k=t.toLowerCase();
  let ex=st.shop.find(i=>i.t.toLowerCase()===k);
  if(ex){if(q)ex.q=q;else if(inc&&!ex.done)ex.q=(ex.q||1)+1;else if(ex.done)delete ex.q;ex.done=false;ex.u=now}
  else{ex={id:uid(),t,c:catOf(t),done:false,u:now};if(q>1)ex.q=q;st.shop.push(ex)}
  const f=st.fav[k];if(f&&f.h)st.fav[k]={p:f.p||0,h:0,u:now};   // racheté : il revient dans « Souvent acheté »
  return ex;
}
function addItem(name){
  const it=shopAdd(name,1);if(!it)return;
  const k=it.t.toLowerCase();st.hist[k]=(st.hist[k]||0)+1;
  if(it.q>1)toast(it.t+' ×'+it.q);
  buzz();save();render();
  const i=$('#ni');if(i){i.focus()}
}
// « Souvent acheté » : épingler 📌 ou retirer ✕ (st.fav[nom]={p,h,u}, partagé)
function favList(all){const inList=new Set(st.shop.filter(i=>!i.done).map(i=>i.t.toLowerCase())),F=st.fav||{};
  const pins=Object.keys(F).filter(k=>F[k].p&&!F[k].h);
  const top=Object.entries(st.hist).filter(([k])=>!(F[k]&&(F[k].h||F[k].p))).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const l=[...pins.sort(),...top.slice(0,all?40:Math.max(0,14-pins.length))];return all?l:l.filter(k=>!inList.has(k))}
function favSet(k,o){st.fav[k]={p:0,h:0,...(st.fav[k]||{}),...o,u:Date.now()};save();favSheet(1);render()}
function favSheet(keep){const l=favList(1),F=st.fav||{};
  sheet(`<h3>⭐ Souvent acheté</h3><p class="mut">📌 = toujours en premier. ✕ = ne plus le proposer (il revient si tu le rachètes).</p>
  ${l.length?l.map(k=>`<div class="item"><span class="t">${F[k]&&F[k].p?'📌 ':''}${esc(k)}</span><button class="x" onclick="favSet(this.dataset.k,{p:${F[k]&&F[k].p?0:1}})" data-k="${esc(k)}" aria-label="Épingler" style="${F[k]&&F[k].p?'':'filter:grayscale(1);opacity:.5'}">📌</button><button class="x" onclick="favSet(this.dataset.k,{h:1,p:0})" data-k="${esc(k)}" aria-label="Retirer">✕</button></div>`).join(''):'<div class="mut">Rien pour l\'instant.</div>'}
  <div class="row" style="margin-top:14px"><button class="btn" onclick="closeSheet()">Terminé ✓</button></div>`,keep)}
function toggleItem(id){const i=st.shop.find(x=>x.id===id);i.done=!i.done;i.u=Date.now();buzz();save();render()}
function delItem(id){gone(id);st.shop=st.shop.filter(x=>x.id!==id);save();render()}
function clearTaken(){st.shop=st.shop.filter(x=>{if(x.done)gone(x.id);return !x.done});save();render();toast('Articles pris retirés 🧺')}
function shareList(){
  const left=st.shop.filter(i=>!i.done);if(!left.length){toast('La liste est vide');return}
  let txt='🛒 Liste de courses\n';
  CATS.forEach((c,ci)=>{const l=left.filter(i=>i.c===ci);if(l.length)txt+='\n'+c[1]+' '+c[0]+'\n'+l.map(i=>'• '+i.t+(i.q>1?' ×'+i.q:'')).join('\n')+'\n'});
  if(navigator.share)navigator.share({text:txt}).catch(()=>{});
  else navigator.clipboard.writeText(txt).then(()=>toast('Liste copiée 📋'),()=>toast('Impossible de copier'));
}
function changeCat(id){
  const it=st.shop.find(x=>x.id===id);
  sheet(`<h3>Rayon pour « ${esc(it.t)} »</h3><div class="chips wrap">${CATS.map((c,i)=>`<button class="chip ${i===it.c?'on':''}" onclick="setCat('${id}',${i})">${c[1]} ${c[0]}</button>`).join('')}</div>`);
}
function setCat(id,i){Object.assign(st.shop.find(x=>x.id===id),{c:i,u:Date.now()});save();closeSheet();render()}

// ---------- Repas ----------
function setMeal(d,k,v){(st.meals[d]=st.meals[d]||{})[k]=v;st.mu[d+k]=Date.now();save()}
// Nos plats (st.dishes, partagé) : chaque plat écrit à la main y est rangé, avec ses ingrédients (ing).
const dishOf=n=>{n=(n||'').trim().toLowerCase();return n&&(st.dishes||[]).find(d=>d.t.trim().toLowerCase()===n)};
function addDish(v){v=(v||'').trim();if(v.length<3||dishOf(v))return;st.dishes.push({id:uid(),t:v,ing:'',u:Date.now()});save()}
function dicePool(){const own=(st.dishes||[]).map(d=>d.t);if(st.diceOwn)return own;const s=new Set(MEALS.map(x=>x.toLowerCase()));return [...MEALS,...own.filter(x=>!s.has(x.toLowerCase()))]}
function dice(d,k){const P=dicePool(),cur=((st.meals[d]||{})[k]||'').toLowerCase();
  if(!P.length){toast('Pas encore de plats à vous : écris-en un dans un repas ✍️');return}
  const Q=P.length>1?P.filter(x=>x.toLowerCase()!==cur):P,v=Q[Math.floor(Math.random()*Q.length)];
  setMeal(d,k,v);const i=document.getElementById('m'+d+k);if(i)i.value=v;buzz()}
function setDiceOwn(b){st.diceOwn=b?1:0;saveLocal();render()}
function dishesSheet(){const L=[...(st.dishes||[])].sort((a,b)=>a.t.localeCompare(b.t,'fr'));
  sheet(`<h3>📖 Nos plats</h3><p class="mut">Chaque plat que vous écrivez dans les repas arrive ici. Ajoute ses ingrédients : ils iront dans les courses en un seul geste.</p>
  ${L.length?L.map(d=>`<div class="item" onclick="dishEdit('${d.id}')"><span class="t"><b>${esc(d.t)}</b><br><span class="mut">${d.ing?esc(d.ing):'Pas encore d\'ingrédients'}</span></span><span class="x">✏️</span></div>`).join(''):'<div class="empty"><b>🍲</b>Aucun plat pour l\'instant.</div>'}
  <div class="row" style="margin-top:12px"><button class="btn" onclick="dishEdit()">+ Ajouter un plat</button></div>`)}
function dishEdit(id){const d=id?st.dishes.find(x=>x.id===id):{t:'',ing:''};ed={id:id||''};
  sheet(`<h3>${id?'Modifier le plat':'Nouveau plat'}</h3><div class="lbl">Nom du plat</div><input id="dn" value="${esc(d.t)}" placeholder="Ex : Lasagnes de maman">
  <div class="lbl">Ingrédients à acheter</div><textarea id="di" placeholder="Ex : pâtes à lasagne, haché, coulis de tomate, mozzarella">${esc(d.ing)}</textarea>
  <p class="mut">Sépare-les par des virgules.</p>
  <div class="row"><button class="btn" onclick="dishSave()">Enregistrer</button>${id?'<button class="btn del" onclick="dishDel()">Supprimer</button>':''}</div>
  <div style="text-align:center;margin-top:10px"><span class="link" onclick="dishesSheet()">‹ Nos plats</span></div>`)}
function dishSave(){const t=$('#dn').value.trim();if(!t){$('#dn').focus();return}const ing=$('#di').value.trim(),o=dishOf(t);
  if(ed.id){Object.assign(st.dishes.find(x=>x.id===ed.id),{t,ing,u:Date.now()})}
  else if(o)Object.assign(o,{ing,u:Date.now()});else st.dishes.push({id:uid(),t,ing,u:Date.now()});
  save();dishesSheet();render()}
function dishDel(){gone(ed.id);st.dishes=st.dishes.filter(x=>x.id!==ed.id);save();dishesSheet();render()}
// Repas de la semaine → courses : les ingrédients enregistrés sont déjà remplis ; ceux qu'on écrit sont retenus.
function mealsToShop(){
  const names=[];for(let d=0;d<7;d++){const m=st.meals[d]||{};['m','s'].forEach(k=>{const v=(m[k]||'').trim();if(v&&!names.some(x=>x.toLowerCase()===v.toLowerCase()))names.push(v)})}
  if(!names.length){toast('Aucun repas prévu');return}
  sheet(`<h3>🛒 Ingrédients → courses</h3><p class="mut">Les ingrédients déjà connus sont remplis. Complète les autres (séparés par des virgules) : Céline s'en souviendra la prochaine fois.</p>
  ${names.map(n=>{const d=dishOf(n);return `<div class="pday"><label class="row" style="font-weight:700"><input type="checkbox" class="ingk" checked style="width:22px;height:22px;flex:none;accent-color:var(--pri)"> ${esc(n)}</label><textarea class="ingd" data-n="${esc(n)}" placeholder="Ex : pâtes, haché, tomates" style="min-height:52px;margin-top:6px">${esc(d?d.ing:'')}</textarea></div>`}).join('')}
  <div class="row" style="margin-top:12px"><button class="btn" onclick="addIng()">Ajouter à la liste</button></div>`);
}
function addIng(){const all=[],now=Date.now();
  document.querySelectorAll('.ingd').forEach((t,i)=>{const n=t.dataset.n,v=t.value.trim();if(!v)return;let d=dishOf(n);
    if(!d){d={id:uid(),t:n,ing:'',u:0};st.dishes.push(d)}if(d.ing!==v){d.ing=v;d.u=now}
    if(document.querySelectorAll('.ingk')[i].checked)all.push(...v.split(/[,\n]/).map(x=>x.trim()).filter(Boolean))});
  const seen=new Set(),v=all.filter(x=>{const k=x.toLowerCase();if(seen.has(k))return false;seen.add(k);return true});
  v.forEach(n=>shopAdd(n));save();closeSheet();toast(v.length?v.length+' article(s) ajouté(s) 🛒':'Rien à ajouter');render()}
function clearMeals(){if(confirm('Vider tous les repas de la semaine ?')){emptyMeals();save();render()}}
function autoMeals(b){st.mealsAuto=b.checked;save()}

// ---------- Agenda ----------
const TYPES=[['rdv','📅','Rendez-vous'],['anniv','🎂','Anniversaire'],['ecole','🎒','École'],['sante','🩺','Santé'],['autre','⭐','Autre']];
function nextOcc(e){
  const t=day0(new Date());
  const [y,m,d]=e.date.split('-').map(Number);
  let dt=new Date(y,m-1,d);
  if(e.yearly){dt=new Date(t.getFullYear(),m-1,d);if(dt<t)dt=new Date(t.getFullYear()+1,m-1,d)}
  return {dt,n:Math.round((dt-t)/864e5),age:e.type==='anniv'&&y>1900&&y<t.getFullYear()?dt.getFullYear()-y:0};
}
function upcoming(){return st.events.map(e=>({e,...nextOcc(e)})).filter(x=>x.n>=-1).sort((a,b)=>a.n-b.n||(a.e.time||'').localeCompare(b.e.time||''))}
function when(n){return n<-1?'Il y a '+(-n)+' jours':n<0?'Hier':n===0?'Aujourd\'hui !':n===1?'Demain':'Dans '+n+' jours'}
function evRow(x){const ty=TYPES.find(t=>t[0]===x.e.type)||TYPES[4];
  return `<div class="ev" onclick="evSheet('${x.e.id}')"><div class="d"><b>${x.dt.getDate()}</b><span>${MOIS[x.dt.getMonth()]}</span></div>
  <div style="flex:1;min-width:0"><div style="font-weight:700;overflow-wrap:anywhere">${ty[1]} ${esc(x.e.t)}${x.age?' <span class="mut">('+x.age+(x.age>1?' ans':' an')+')</span>':''}</div>
  <div class="mut">${x.e.time?'🕐 '+esc(x.e.time)+' · ':''}<span class="tag ${x.n<=1?'now':''}">${when(x.n)}</span></div></div></div>`}
function evSheet(id){
  const e=id?st.events.find(x=>x.id===id):{t:'',date:(tab==='agenda'&&calSel)||ymd(new Date()),time:'',type:'rdv',yearly:false,cd:false};
  ed={id:id||'',type:e.type};
  sheet(`<h3>${id?'Modifier':'Nouvel événement'}</h3>
  <div class="chips wrap">${TYPES.map(t=>`<button class="chip tch ${t[0]===e.type?'on':''}" onclick="setType('${t[0]}',this)">${t[1]} ${t[2]}</button>`).join('')}</div>
  <div class="lbl">Quoi ?</div><input id="et" value="${esc(e.t)}" placeholder="Ex : Dentiste, Anniversaire de maman…">
  <div class="lbl">Quand ?</div><div class="row"><input type="date" id="ed" value="${e.date}"><input type="time" id="eh" value="${esc(e.time)}" style="max-width:130px"></div>
  <label class="tog"><input type="checkbox" id="ey" ${e.yearly?'checked':''}> 🔁 Revient chaque année</label>
  <label class="tog"><input type="checkbox" id="er" ${e.rem===false?'':'checked'}> 🔔 Me le rappeler <span class="mut">(la veille à 19h et 1 h avant)</span></label>
  <label class="tog"><input type="checkbox" id="ec" ${e.cd?'checked':''}> ⏳ Compte à rebours sur l'accueil <span class="mut">(ex. J-12 avant les vacances)</span></label>
  <div class="row"><button class="btn" onclick="saveEv()">Enregistrer</button>${id?`<button class="btn del" onclick="delEv()">Supprimer</button>`:''}</div>`);
}
function setType(t,b){ed.type=t;document.querySelectorAll('.tch').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(t==='anniv')$('#ey').checked=true}
function saveEv(){
  const t=$('#et').value.trim(),d=$('#ed').value;if(!t){$('#et').focus();return}if(!d){$('#ed').focus();return}
  const o={t,date:d,time:$('#eh').value,type:ed.type,yearly:$('#ey').checked,rem:$('#er').checked,cd:$('#ec').checked,u:Date.now()};
  if(ed.id)Object.assign(st.events.find(x=>x.id===ed.id),o);else st.events.push({id:uid(),...o});
  save();closeSheet();render();
}
function delEv(){gone(ed.id);st.events=st.events.filter(x=>x.id!==ed.id);save();closeSheet();render();toast('Événement supprimé')}

// ---------- Calendrier ----------
let calM=null,calSel=null,calX=null;
// Jour du mois m (0-11) de l'année y où tombe l'événement, sinon 0.
function occOn(e,y,m){const [ey,em,ed]=e.date.split('-').map(Number);return (e.yearly||ey===y)&&em-1===m&&ed<=new Date(y,m+1,0).getDate()?ed:0}
function calMove(k){calM=new Date(calM.getFullYear(),calM.getMonth()+k,1);render()}
function calPick(k){if(paint){setSched(k,paint==='x'||shiftOn(k)&&shiftOn(k).id===paint?'':paint);buzz();render();return}if(k===calSel){evSheet();return}calSel=k;render()}
// Horaire : st.sched[date]={v:id du type,u}
let paint=null,pat=null;
const shiftOn=k=>{const e=st.sched[k]||{},t=e.v&&st.shifts.find(x=>x.id===e.v);return t?{...t,h:e.h||t.h}:null};
// Horaire d'un jour précis, avec ses propres heures (ex. 8h – 17h)
const hm=v=>{if(!v)return '';const [h,m]=v.split(':');return (+h)+'h'+(m!=='00'?m:'')};
const toHM=t=>{const m=(t||'').match(/(\d{1,2})\s*[h:]\s*(\d{2})?/);return m?String(m[1]).padStart(2,'0')+':'+(m[2]||'00'):''};
function setSched(k,v){st.sched[k]={v,u:Date.now()};save()}
const shLabel=x=>x?`${esc(x.e)} ${esc(x.n)}${x.h?' · '+esc(x.h):''}`:'';
function paintMode(on){paint=on?(paint||(st.shifts[0]||{}).id||'x'):null;render();if(on)window.scrollTo(0,0)}
function paintPick(id){paint=id;render()}
// Heures de base d'un type (« 8h – 17h ») → ['08:00','17:00']
const typeHM=id=>{const x=st.shifts.find(s=>s.id===id);const [a,b]=((x&&x.h)||'').split(/[–-]/);return [toHM(a),toHM(b)]};
const hRange=(a,b)=>a||b?hm(a)+(b?' – '+hm(b):''):'';
// N'enregistre des heures propres au jour que si elles diffèrent des heures de base du type.
function schedVal(v,a,b,now){const [ta,tb]=typeHM(v),o={v,u:now};if((a||b)&&(a!==ta||b!==tb))o.h=hRange(a,b);return o}
function daySheet(k,keep){
  const e=st.sched[k]||{};
  ed={k,v:e.v||(st.shifts[1]||st.shifts[0]||{}).id||''};if(keep)ed.v=keep;
  let [a,b]=typeHM(ed.v);if(!keep&&e.h){const [x,y]=e.h.split(/[–-]/);a=toHM(x);b=toHM(y)}
  const [y,m,d]=k.split('-').map(Number);
  sheet(`<h3>💼 ${new Date(y,m-1,d).toLocaleDateString('fr-BE',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase())}</h3>
  <div class="lbl">Quel genre de journée ?</div><div class="chips wrap">${st.shifts.map(x=>`<button class="chip ${ed.v===x.id?'on':''}" style="${ed.v===x.id?'':'background:'+x.c+';color:#4a3940'}" onclick="daySheet(ed.k,'${x.id}')">${esc(x.e)} ${esc(x.n)}</button>`).join('')}</div>
  <div class="lbl">Heures</div>
  <div class="row"><span>De</span><input type="time" id="dh1" value="${a}"><span>à</span><input type="time" id="dh2" value="${b}"></div>
  <p class="mut">Les heures habituelles sont déjà mises. Change-les seulement si ce jour-là est différent.</p>
  <div class="row" style="margin-top:10px"><button class="btn" onclick="saveDay()">Enregistrer</button>${e.v?`<button class="btn del" onclick="setSched(ed.k,'');closeSheet();render()">Effacer</button>`:''}</div>`);
}
function saveDay(){st.sched[ed.k]=schedVal(ed.v,$('#dh1').value,$('#dh2').value,Date.now());save();closeSheet();render();toast('Horaire enregistré 💼')}
// Semaine type : pour chaque jour, le genre de journée ET les heures.
function weekSheet(){
  const t=new Date(),end=new Date(t.getFullYear(),11,31);
  pat=pat||st.pat||{n:1,w:[[],[]]};
  pat.w=pat.w.map(w=>Array.from({length:7},(_,i)=>{const x=w[i];return typeof x==='string'?{v:x}:(x||{v:''})}));
  const from=ymd(t),to=ymd(end<=t?new Date(t.getFullYear()+1,11,31):end);
  const wk=w=>DAYS.map((d,i)=>{const c=pat.w[w][i];if(c.v&&c.a===undefined)[c.a,c.b]=typeHM(c.v);
    return `<div class="pday"><b>${d}</b><div class="chips wrap">${[{id:'',e:'—',n:'Rien'},...st.shifts].map(x=>`<button class="chip pw${w}d${i} ${c.v===x.id?'on':''}" onclick="setPat(${w},${i},'${x.id}',this)">${esc(x.e)} ${esc(x.n)}</button>`).join('')}</div>
    <div class="row ph${w}d${i}" style="${c.v?'':'display:none'}"><span>De</span><input type="time" value="${c.a||''}" oninput="pat.w[${w}][${i}].a=this.value"><span>à</span><input type="time" value="${c.b||''}" oninput="pat.w[${w}][${i}].b=this.value"></div></div>`}).join('');
  sheet(`<h3>🔁 Ma semaine type</h3><p class="mut">Remplis <b>une seule fois</b> ta semaine habituelle (le genre de journée et les heures). Céline remplit tout le calendrier pour toi.</p>
  <label class="tog"><input type="checkbox" ${pat.n===2?'checked':''} onchange="pat.n=this.checked?2:1;weekSheet()"> Mon horaire change une semaine sur deux</label>
  ${pat.n===2?'<h3 style="margin-top:6px">Semaine 1</h3>':''}${wk(0)}${pat.n===2?'<h3 style="margin-top:18px">Semaine 2</h3>'+wk(1):''}
  <div class="lbl">De quand à quand ?</div><div class="row"><input type="date" id="pf" value="${from}"><input type="date" id="pt" value="${to}"></div>
  ${pat.n===2?'<p class="mut">La semaine 1 commence la semaine de la première date.</p>':''}
  <div class="row" style="margin-top:14px"><button class="btn" onclick="applyPat()">✨ Remplir le calendrier</button></div>`);
}
function setPat(w,i,id,b){const c=pat.w[w][i];c.v=id;[c.a,c.b]=typeHM(id);
  document.querySelectorAll('.pw'+w+'d'+i).forEach(x=>x.classList.remove('on'));b.classList.add('on');
  const r=$('.ph'+w+'d'+i);r.style.display=id?'':'none';const [x,y]=r.querySelectorAll('input');x.value=c.a||'';y.value=c.b||''}
function applyPat(){
  const f=$('#pf').value,t=$('#pt').value;if(!f||!t||t<f){toast('Vérifie les dates');return}
  const [fy,fm,fd]=f.split('-').map(Number),d=new Date(fy,fm-1,fd),mon=new Date(d);mon.setDate(d.getDate()-(d.getDay()+6)%7);
  let n=0;const now=Date.now();
  while(ymd(d)<=t&&n<800){const i=(d.getDay()+6)%7,w=Math.floor(Math.round((day0(d)-mon)/864e5)/7)%pat.n,c=pat.w[w][i];
    if(c&&c.v){st.sched[ymd(d)]=schedVal(c.v,c.a,c.b,now);n++}d.setDate(d.getDate()+1)}
  st.pat=pat;save();closeSheet();calM=new Date(fy,fm-1,1);render();toast(n+' jours remplis ✨');
}
// Répéter une semaine déjà remplie (ou deux) jusqu'à une date.
function repeatSheet(){
  const [y,m,d]=calSel.split('-').map(Number),mon=new Date(y,m-1,d);mon.setDate(mon.getDate()-(mon.getDay()+6)%7);
  const t=new Date(),end=new Date(t.getFullYear(),11,31);
  sheet(`<h3>📋 Recopier une semaine</h3><p class="mut">Tu as rempli une semaine comme il faut ? Recopie-la sur les semaines suivantes.</p>
  <div class="lbl">Semaine à recopier (commence le lundi)</div><input type="date" id="rf" value="${ymd(mon)}">
  <label class="tog"><input type="checkbox" id="r2"> Recopier 2 semaines (horaire qui change une semaine sur deux)</label>
  <div class="lbl">Jusqu'au</div><input type="date" id="rt" value="${ymd(end<=t?new Date(t.getFullYear()+1,11,31):end)}">
  <div class="row" style="margin-top:14px"><button class="btn" onclick="doRepeat()">📋 Recopier</button></div>`)}
function doRepeat(){
  const [y,m,d]=$('#rf').value.split('-').map(Number),mon=new Date(y,m-1,d);mon.setDate(mon.getDate()-(mon.getDay()+6)%7);
  const L=$('#r2').checked?14:7,to=$('#rt').value,src=[];
  for(let i=0;i<L;i++){const x=new Date(mon);x.setDate(mon.getDate()+i);src.push(st.sched[ymd(x)]||{})}
  if(!src.some(x=>x.v)){toast('Cette semaine est vide : remplis-la d\'abord');return}
  const now=Date.now(),x=new Date(mon);x.setDate(mon.getDate()+L);let n=0,i=0;
  while(ymd(x)<=to&&i<800){const c=src[i%L];if(c.v){st.sched[ymd(x)]={v:c.v,u:now,...(c.h?{h:c.h}:{})};n++}x.setDate(x.getDate()+1);i++}
  save();closeSheet();render();toast(n+' jours recopiés ✨');
}
function clearSchedSheet(){
  const t=new Date();sheet(`<h3>🧽 Effacer l'horaire</h3><div class="lbl">De quand à quand ?</div><div class="row"><input type="date" id="cf" value="${ymd(t)}"><input type="date" id="ct" value="${ymd(new Date(t.getFullYear(),11,31))}"></div>
  <div class="row" style="margin-top:14px"><button class="btn del" style="flex:1" onclick="clearSched()">Effacer ces jours</button></div>`)}
function clearSched(){const f=$('#cf').value,t=$('#ct').value,now=Date.now();let n=0;for(const k in st.sched)if(k>=f&&k<=t&&st.sched[k].v){st.sched[k]={v:'',u:now};n++}save();closeSheet();render();toast(n+' jours effacés')}
function typesSheet(){
  sheet(`<h3>✏️ Mes types de journée</h3><p class="mut">Touche l'image ou la couleur pour la changer.</p>
  ${st.shifts.map(x=>`<div class="row" style="margin:8px 0"><button class="chip" style="font-size:20px;padding:6px 10px" onclick="cycShift('${x.id}','e')">${esc(x.e)}</button>
    <button class="chip" style="width:34px;height:34px;padding:0;background:${x.c}" onclick="cycShift('${x.id}','c')" aria-label="Couleur"></button>
    <input value="${esc(x.n)}" placeholder="Nom" style="padding:10px" oninput="edShift('${x.id}','n',this.value)">
    <input value="${esc(x.h)}" placeholder="ex. 8h – 17h" style="padding:10px;max-width:120px" oninput="edShift('${x.id}','h',this.value)">
    <button class="x" onclick="delShift('${x.id}')" aria-label="Supprimer">🗑️</button></div>`).join('')}
  <div class="row" style="margin-top:12px"><button class="btn soft" onclick="addShift()">+ Ajouter un type</button><button class="btn" onclick="closeSheet();render()">Terminé</button></div>`)}
function edShift(id,k,v){const x=st.shifts.find(s=>s.id===id);x[k]=v;x.u=Date.now();save()}
function cycShift(id,k){const x=st.shifts.find(s=>s.id===id),L=k==='e'?SEMO:SCOL;x[k]=L[(L.indexOf(x[k])+1)%L.length];x.u=Date.now();save();typesSheet()}
function addShift(){st.shifts.push({id:uid(),e:'💼',n:'Travail',h:'',c:SCOL[st.shifts.length%SCOL.length],u:Date.now()});save();typesSheet()}
function delShift(id){gone(id);st.shifts=st.shifts.filter(s=>s.id!==id);if(paint===id)paint=null;save();typesSheet()}
function calToday(){const t=new Date();calM=new Date(t.getFullYear(),t.getMonth(),1);calSel=ymd(t);render()}
function calSwipe(ev){if(calX===null)return;const dx=ev.changedTouches[0].clientX-calX;calX=null;if(Math.abs(dx)>60)calMove(dx<0?1:-1)}

// ---------- Alerte du jour (accueil) ----------
// Tout ce qui arrive aujourd'hui (rendez-vous, anniversaires…) en haut de l'accueil, et un rappel de demain.
function alertCard(){
  const up=upcoming(),td=up.filter(x=>x.n===0),tm=up.filter(x=>x.n===1);
  if(!td.length&&!tm.length)return '';
  const line=x=>{const ty=TYPES.find(t=>t[0]===x.e.type)||TYPES[4];
    return `<div class="al-i"><span class="al-e">${ty[1]}</span><div style="flex:1;min-width:0"><b>${esc(x.e.t)}</b>${x.age?' ('+x.age+(x.age>1?' ans':' an')+')':''}${x.e.time?`<div class="al-t">🕐 ${esc(x.e.time)}</div>`:''}</div></div>`};
  return `<div class="card alert" onclick="calSel=null;go('agenda')">
    ${td.length?`<h2>🔔 Aujourd'hui, ne pas oublier !</h2>${td.map(line).join('')}`:''}
    ${tm.length?`<div class="al-tm">${td.length?'':'<h2>🔔 Demain, ne pas oublier</h2>'}${td.length?'<div class="al-l">Demain</div>':''}${tm.map(line).join('')}</div>`:''}
  </div>`;
}

// Motifs en SVG
const svgURL=g=>'url("data:image/svg+xml,'+encodeURIComponent(g)+'")';
function flower(cx,cy,r,pe,ce,rot){let g=`<g transform="translate(${cx} ${cy}) rotate(${rot})">`;for(let k=0;k<5;k++)g+=`<ellipse cx="0" cy="${-r*.62}" rx="${r*.42}" ry="${r*.62}" fill="${pe}" transform="rotate(${k*72})"/>`;return g+`<circle r="${r*.3}" fill="${ce}"/></g>`}
const leaf=(cx,cy,l,rot,c)=>`<path d="M0 0 Q${l/2} ${-l*.35} ${l} 0 Q${l/2} ${l*.35} 0 0Z" fill="${c}" transform="translate(${cx} ${cy}) rotate(${rot})"/>`;
const heart=(cx,cy,z,c)=>`<path d="M0 ${z*.3} C${-z*.9} ${-z*.3} ${-z*.35} ${-z*.95} 0 ${-z*.35} C${z*.35} ${-z*.95} ${z*.9} ${-z*.3} 0 ${z*.3}Z" fill="${c}" transform="translate(${cx} ${cy})"/>`;

@media (prefers-color-scheme:dark){:root:root{${v(D,1)};--ink:#f1eef2;--mut:#a39ca6}}

// Réduit la photo (max 1400 px) et la compresse pour qu'elle reste légère.
function pickPhoto(inp){
  const f=inp.files&&inp.files[0];if(!f)return;inp.value='';toast('Photo en préparation…');
  const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{const k=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    let q=.82,d=c.toDataURL('image/jpeg',q);while(d.length>1.6e6&&q>.4){q-=.12;d=c.toDataURL('image/jpeg',q)}
    try{localStorage.setItem('celine-bg',d);bgPhoto=d;applyPhoto();photoUp();colorSheet();toast('Photo de fond mise 📷')}
    catch(e){toast('Photo trop lourde pour ce téléphone, essaie une autre')}};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Impossible de lire cette photo')};
  img.src=url;

  const c=document.createElement('canvas'),r=devicePixelRatio||1,W=innerWidth,H=innerHeight;c.className='cf';c.width=W*r;c.height=H*r;c.style.width=W+'px';c.style.height=H+'px';

    P.forEach(p=>{p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;g.save();g.globalAlpha=Math.max(0,1-k*k);g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);g.restore()});

function binPick(i){ed.e=BINP[i][0];$('#be').textContent=ed.e;$('#bn').value=BINP[i][1]}
function binEmo(){const L=[...BINP.map(p=>p[0]),'🗑️','♻️','👕','🔋'];ed.e=L[(L.indexOf(ed.e)+1)%L.length];$('#be').textContent=ed.e}
function binSave(){const n=$('#bn').value.trim(),d=$('#bd').value;if(!n){$('#bn').focus();return}if(!d){$('#bd').focus();return}

  save();binsSheet();render();toast('Collecte enregistrée 🗑️')}
function binDel(){gone(ed.id);st.bins=st.bins.filter(x=>x.id!==ed.id);save();binsSheet();render()}

// ---------- Listes à cocher réutilisables : st.lists = {id,e,t,items:[{id,t,ok,o}],u} ----------
const LTPL=[['🧳','Valise week-end',['Pyjama','Sous-vêtements','Vêtements de rechange','Trousse de toilette','Brosse à dents','Médicaments','Chargeur de téléphone']],
  ['🎒','Sac de sortie',['Clés','Portefeuille','Mouchoirs','Gourde','Collation','Lingettes','Veste de pluie']],
  ['🏊','Piscine',['Maillot','Serviette','Bonnet','Lunettes de natation','Gel douche','Peigne','Collation']],
  ['🏖️','Avant de partir en vacances',['Cartes d\'identité','Chargeurs','Médicaments','Crème solaire','Vider le frigo','Sortir les poubelles','Arroser les plantes','Fermer les fenêtres']],
  ['📝','Liste vide',[]]];
function listsSheet(){const L=st.lists||[];
  sheet(`<h3>✅ Mes listes</h3><p class="mut">Des listes à cocher que l'on réutilise (valise, sac…). Partagées avec la famille.</p>
  ${L.map(l=>{const it=l.items||[],dn=it.filter(i=>i.ok).length;return `<div class="item" onclick="listOpen('${l.id}')"><span class="e">${esc(l.e)}</span><span class="t"><b>${esc(l.t)}</b></span><span class="rep">${dn}/${it.length}</span></div>`}).join('')}
  <div class="lbl">Nouvelle liste</div><div class="chips wrap">${LTPL.map((x,i)=>`<button class="chip" onclick="listNew(${i})">${x[0]} ${esc(x[1])}</button>`).join('')}</div>`)}
function listNew(i){const [e,t,items]=LTPL[i],now=Date.now(),l={id:uid(),e,t,items:items.map((x,k)=>({id:uid()+k,t:x,ok:false,o:k})),u:now};
  st.lists.push(l);save();listOpen(l.id);if(!items.length)setTimeout(()=>{const n=$('#li');n&&n.focus()},250)}
const curList=()=>st.lists.find(x=>x.id===ed.lid);
function listOpen(id,keep){const l=st.lists.find(x=>x.id===id);if(!l){listsSheet();return}ed={lid:id};const it=l.items||[],dn=it.filter(i=>i.ok).length;
  sheet(`<h3>${esc(l.e)} ${esc(l.t)} <small class="mut">${dn}/${it.length}</small></h3>
  ${it.map(i=>`<div class="item ${i.ok?'done':''}"><button class="ck" onclick="listTog('${i.id}')" aria-label="Fait">✓</button><span class="t" onclick="listTog('${i.id}')">${esc(i.t)}</span><button class="x" onclick="listDelIt('${i.id}')" aria-label="Retirer">✕</button></div>`).join('')}
  <div class="addrow" style="margin-top:10px"><input id="li" placeholder="Ajouter une ligne…" enterkeyhint="done" onkeydown="if(event.key==='Enter')listAdd()"><button onclick="listAdd()">+</button></div>
  <div class="row" style="margin-top:14px"><button class="btn soft" onclick="listReset()">🔄 Tout décocher</button><button class="btn" onclick="listsSheet()">‹ Mes listes</button></div>
  <div class="row" style="margin-top:12px;justify-content:space-between"><span class="link" onclick="listRename()">✏️ Renommer</span><span class="link" style="color:#d9534f" onclick="listDel()">🗑️ Supprimer la liste</span></div>`,keep)}
function listTouch(l){l.u=Date.now();save();listOpen(l.id,1)}
function listTog(id){const l=curList(),i=l&&l.items.find(x=>x.id===id);if(!i)return;i.ok=!i.ok;buzz();listTouch(l);if(l.items.length&&l.items.every(x=>x.ok))toast('Tout est prêt ! ✅')}
function listAdd(){const l=curList(),v=($('#li').value||'').trim();if(!l||!v)return;l.items.push({id:uid(),t:v,ok:false,o:Date.now()});listTouch(l);const n=$('#li');if(n)n.focus()}
function listDelIt(id){const l=curList();if(!l)return;l.items=l.items.filter(x=>x.id!==id);listTouch(l)}
function listReset(){const l=curList();if(!l)return;l.items.forEach(x=>x.ok=false);listTouch(l);toast('Liste remise à zéro 🔄')}
function listRename(){const l=curList();if(!l)return;const n=prompt('Nouveau nom de la liste :',l.t);if(n&&n.trim()){l.t=n.trim();listTouch(l)}}
function listDel(){const l=curList();if(!l||!confirm('Supprimer la liste « '+l.t+' » ?'))return;gone(l.id);st.lists=st.lists.filter(x=>x.id!==l.id);save();listsSheet()}

// ---------- Infos utiles : st.infos = {id,e,t,v,u} (dispo aussi sans connexion) ----------

const telify=v=>esc(v).replace(/\+?\d[\d .\/-]{5,}\d/g,m=>{const d=m.replace(/[^\d+]/g,'');return d.replace('+','').length>=8?`<a href="tel:${d}">${m}</a>`:m});
function infosSheet(){const L=st.infos||[];
  sheet(`<h3>📇 Infos utiles</h3><p class="mut">Les infos importantes de la famille, toujours sous la main (même sans internet). Partagées avec la famille.</p>
  ${L.map(x=>`<div class="item"><span class="e">${esc(x.e)}</span><span class="t"><b>${esc(x.t)}</b><span class="ib">${telify(x.v)}</span></span><button class="x" onclick="infoEdit('${x.id}')" aria-label="Modifier">✏️</button></div>`).join('')}
  <div class="lbl">Ajouter</div><div class="chips wrap">${INFP.map((p,i)=>`<button class="chip" onclick="infoEdit('',${i})">${p[0]} ${p[1]}</button>`).join('')}<button class="chip" onclick="infoEdit('',-1)">➕ Autre</button></div>

function infoEdit(id,pi){const x=id?st.infos.find(i=>i.id===id):{e:pi>=0?INFP[pi][0]:'📌',t:pi>=0?INFP[pi][1]:'',v:''};ed={id:id||'',e:x.e};

  <div class="lbl">Info</div><textarea id="iv" placeholder="Ex : Dr Dupont, 04 123 45 67, rue de la Gare 12">${esc(x.v)}</textarea>
  <div class="row" style="margin-top:12px"><button class="btn" onclick="infoSave()">Enregistrer</button>${id?'<button class="btn del" onclick="infoDel()">Supprimer</button>':''}</div>
  <div style="text-align:center;margin-top:10px"><span class="link" onclick="infosSheet()">‹ Infos utiles</span></div>`);if(!id)setTimeout(()=>{const v=$('#iv');v&&v.focus()},250)}
function infoSave(){const t=$('#it').value.trim(),v=$('#iv').value.trim();if(!t){$('#it').focus();return}
  if(ed.id)Object.assign(st.infos.find(i=>i.id===ed.id),{t,v,u:Date.now()});else st.infos.push({id:uid(),e:ed.e,t,v,u:Date.now()});save();infosSheet()}
function infoDel(){gone(ed.id);st.infos=st.infos.filter(i=>i.id!==ed.id);save();infosSheet()}

// ---------- Petit mot secret et coup de pouce : st.msgs = {id,k:'mot'|'pouce',from,to,t,e,d,seen,u} ----------
// Petit mot : remplace la phrase du jour sur l'accueil de la personne choisie, jusqu'à ce qu'elle touche « Merci ».
// Coup de pouce : bandeau en haut de l'accueil des autres, seulement le jour même.
function motHTML(){const m=(st.msgs||[]).filter(x=>x.k==='mot'&&st.me&&x.to===st.me&&!x.seen).sort((a,b)=>b.u-a.u)[0];if(!m)return '';
  return `<div class="quote mot">💌 <b>Un petit mot de ${esc(profName(m.from)||'quelqu\'un qui t\'aime')}</b><br>${esc(m.t)}<button onclick="msgSeen('${m.id}')">❤️ Merci</button></div>`}
function msgSeen(id){const m=st.msgs.find(x=>x.id===id);if(!m)return;Object.assign(m,{seen:Date.now(),seenBy:st.me||'',u:Date.now()});buzz();save();render()}
function motSheet(to){if(!needMe())return;const os=others();
  if(!os.length){sheet(`<h3>💌 Petit mot secret</h3><p>Pour envoyer un petit mot, l'autre téléphone doit d'abord ouvrir Céline et choisir son prénom (« Qui utilise ce téléphone ? »).</p><div class="row"><button class="btn" onclick="closeSheet()">D'accord</button></div>`);return}
  to=os.some(p=>p.id===to)?to:os[0].id;ed={to};const cur=st.msgs.find(m=>m.id==='mot-'+st.me+'-'+to),nm=esc(profName(to));
  sheet(`<h3>💌 Petit mot secret</h3><p class="mut">Il remplace la phrase du jour sur l'accueil de <b>${nm}</b>, jusqu'à ce qu'il (ou elle) le lise.</p>
  ${os.length>1?`<div class="chips wrap">${os.map(p=>`<button class="chip ${p.id===to?'on':''}" onclick="motSheet('${p.id}')">Pour ${esc(p.name)}</button>`).join('')}</div>`:''}
  <textarea id="mt" maxlength="240" placeholder="Ex : Bonne journée, je pense à toi 💗"></textarea>
  ${cur?`<p class="mut">Dernier mot : « ${esc(cur.t)} » · ${cur.seen?'lu ❤️':'pas encore lu'}</p>`:''}
  <div class="row" style="margin-top:12px"><button class="btn" onclick="motSend()">💌 Envoyer à ${nm}</button></div>`);setTimeout(()=>{const t=$('#mt');t&&t.focus()},250)}
function motSend(){const t=$('#mt').value.trim();if(!t){$('#mt').focus();return}const id='mot-'+st.me+'-'+ed.to;
  st.msgs=st.msgs.filter(m=>m.id!==id);st.msgs.push({id,k:'mot',from:st.me,to:ed.to,t,seen:0,u:Date.now()});save();closeSheet();toast('Petit mot envoyé 💌')}
const POUCE=[['😮‍💨','Journée chargée, besoin d\'un relais ce soir'],['🍝','Je m\'occupe du souper ce soir'],['🛒','Je passe faire les courses'],['⏰','Je rentre plus tard'],['🛋️','J\'ai besoin d\'une petite pause'],['🤗','J\'ai besoin d\'un câlin']];
function pouceCards(){const td=ymd(new Date());
  return (st.msgs||[]).filter(m=>m.k==='pouce'&&m.d===td&&m.from!==st.me&&!m.seen).map(m=>`<div class="card pouce"><h2>🤝 ${esc(profName(m.from)||'Coup de pouce')}</h2><div class="msg">${esc(m.e)} ${esc(m.t)}</div><button class="btn soft" style="width:100%" onclick="msgSeen('${m.id}')">👍 Bien reçu</button></div>`).join('')}
function pouceSheet(){if(!needMe())return;const mine=st.msgs.find(m=>m.id==='pouce-'+st.me&&m.d===ymd(new Date()));
  sheet(`<h3>🤝 Coup de pouce</h3><p class="mut">Un petit message qui s'affiche aujourd'hui en haut de l'accueil des autres${st.notif?', avec une notification':''}.</p>
  ${mine?`<div class="pday">Envoyé aujourd'hui : <b>${esc(mine.e)} ${esc(mine.t)}</b><br><span class="mut">${mine.seen?'👍 Vu'+(profName(mine.seenBy)?' par '+esc(profName(mine.seenBy)):''):'Pas encore vu'}</span> · <span class="link" onclick="pouceOff()">Retirer</span></div>`:''}
  ${POUCE.map((p,i)=>`<div class="item" onclick="pouceSend(${i})"><span class="e">${p[0]}</span><span class="t">${esc(p[1])}</span><span class="rep">Envoyer ›</span></div>`).join('')}
  <div class="lbl">Ou écris le tien</div><div class="addrow"><input id="pc" placeholder="Ex : Je récupère le colis" enterkeyhint="send" onkeydown="if(event.key==='Enter')pouceSend(-1)"><button onclick="pouceSend(-1)" aria-label="Envoyer">➤</button></div>`)}
function pouceSend(i){const p=i<0?['🤝',($('#pc').value||'').trim()]:POUCE[i];if(!p[1]){$('#pc').focus();return}const id='pouce-'+st.me;
  st.msgs=st.msgs.filter(m=>m.id!==id);st.msgs.push({id,k:'pouce',from:st.me,to:'*',e:p[0],t:p[1],d:ymd(new Date()),seen:0,u:Date.now()});buzz();save();closeSheet();render();toast('Coup de pouce envoyé 🤝')}
function pouceOff(){const id='pouce-'+st.me;gone(id);st.msgs=st.msgs.filter(m=>m.id!==id);save();closeSheet();render()}

// ---------- Météo (Open-Meteo, gratuit et sans clé) : st.wxLoc={lat,lon,n} et dernière prévision dans celine-wx, propres au téléphone ----------
let wx=null;try{wx=JSON.parse(localStorage.getItem('celine-wx'))}catch(e){}
const wxEmo=c=>c===0?'☀️':c<=2?'🌤️':c===3?'☁️':c<=48?'🌫️':c<=57?'🌦️':c<=67?'🌧️':c<=77?'🌨️':c<=82?'🌦️':c<=86?'🌨️':'⛈️';
function wxLoad(force){const L=st.wxLoc;if(!L)return;if(!force&&wx&&wx.lat===L.lat&&wx.lon===L.lon&&wx.d===ymd(new Date())&&Date.now()-wx.t<36e5)return;
  fetch('https://api.open-meteo.com/v1/forecast?latitude='+L.lat+'&longitude='+L.lon+'&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=2')
    .then(r=>r.ok?r.json():Promise.reject()).then(j=>{const D=j.daily,R=i=>({c:D.weather_code[i],mx:Math.round(D.temperature_2m_max[i]),mn:Math.round(D.temperature_2m_min[i]),p:D.precipitation_probability_max[i]??0});
      wx={lat:L.lat,lon:L.lon,t:Date.now(),d:D.time[0],now:Math.round(j.current.temperature_2m),nc:j.current.weather_code,td:R(0),tm:R(1)};
      try{localStorage.setItem('celine-wx',JSON.stringify(wx))}catch(e){}if(tab==='home')softRender();if($('#wxs')&&$('#sh').classList.contains('on'))wxSheet(1)}).catch(()=>{})}
function wxLine(){if(!st.wxLoc||!wx||wx.d!==ymd(new Date()))return '';
  return `<div class="wx" onclick="wxSheet()">${wxEmo(wx.nc)} ${wx.now}° <span>· ${wx.td.mn}° / ${wx.td.mx}° · 💧 pluie ${wx.td.p} %</span></div>`}
let wxRes=[];
function wxSheet(keep){const L=st.wxLoc,ok=L&&wx&&wx.d===ymd(new Date());
  sheet(`<h3 id="wxs">🌤️ Météo</h3>${L?`<p class="mut">📍 ${esc(L.n)}</p>`:'<p class="mut">La température et le risque de pluie, en haut de l\'accueil. Choisis ta commune.</p>'}
  ${ok?`<div class="pday"><b>Aujourd'hui : ${wxEmo(wx.td.c)} ${wx.td.mn}° / ${wx.td.mx}° · 💧 ${wx.td.p} %</b>Demain : ${wxEmo(wx.tm.c)} ${wx.tm.mn}° / ${wx.tm.mx}° · 💧 ${wx.tm.p} %</div>`:''}
  <div class="lbl">${L?'Changer de commune':'Ta commune'}</div>
  <div class="addrow"><input id="wq" placeholder="Ex : Namur" enterkeyhint="search" onkeydown="if(event.key==='Enter')wxFind()"><button onclick="wxFind()" aria-label="Chercher">🔎</button></div>
  <div class="chips wrap" id="wxr" style="margin-top:8px"></div>
  <div class="row" style="margin-top:8px"><button class="btn soft" onclick="wxGeo()">📍 Utiliser ma position</button></div>
  ${L?'<div style="text-align:center;margin-top:12px"><span class="link" style="color:var(--mut)" onclick="wxOff()">Retirer la météo</span></div>':''}
  <p class="mut" style="margin-top:12px">Seulement sur ce téléphone. Prévisions : Open-Meteo.</p>`,keep)}
function wxFind(){const q=($('#wq').value||'').trim();if(q.length<2)return;$('#wxr').innerHTML='<span class="mut">Recherche…</span>';
  fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=fr&format=json&name='+encodeURIComponent(q)).then(r=>r.json()).then(j=>{wxRes=j.results||[];
    $('#wxr').innerHTML=wxRes.length?wxRes.map((x,i)=>`<button class="chip" onclick="wxPick(${i})">${esc(x.name)}<span class="mut"> · ${esc([x.admin1,x.country].filter(Boolean).join(', '))}</span></button>`).join(''):'<span class="mut">Aucune commune trouvée.</span>'})
    .catch(()=>{$('#wxr').innerHTML='<span class="mut">Pas de connexion.</span>'})}
function wxSet(lat,lon,n){st.wxLoc={lat:+(+lat).toFixed(3),lon:+(+lon).toFixed(3),n};saveLocal();wxLoad(1);wxSheet(1);toast('Météo ajoutée 🌤️')}
function wxPick(i){const x=wxRes[i];if(x)wxSet(x.latitude,x.longitude,x.name+(x.admin1?' ('+x.admin1+')':''))}
function wxGeo(){if(!navigator.geolocation){toast('Position non disponible');return}toast('Recherche de ta position…');
  navigator.geolocation.getCurrentPosition(p=>wxSet(p.coords.latitude,p.coords.longitude,'Ma position'),()=>toast('Position refusée : cherche ta commune'),{timeout:15000,maximumAge:36e5})}
function wxOff(){delete st.wxLoc;wx=null;try{localStorage.removeItem('celine-wx')}catch(e){}saveLocal();closeSheet();render()}

const hk=k=>'k'+encodeURIComponent(k).replace(/\./g,'%2E');
function norm(x){
  if(x===null||x===undefined||x==='')return undefined;
  if(typeof x!=='object')return x;
  const o={};Object.keys(x).sort().forEach(k=>{const v=norm(x[k]);if(v!==undefined&&!(typeof v==='object'&&!Object.keys(v).length))o[k]=v});return o;
}
const asMap=a=>{const o={};(a||[]).forEach(x=>{if(x&&x.id)o[x.id]=x});return o};
function pack(s){
  const meals={};for(let d=0;d<7;d++)for(const k of['m','s']){const u=s.mu[d+k]||0,v=(s.meals[d]||{})[k]||'';if(u||v)meals[d+k]={v,u}}
  const hist={};for(const k in s.hist)hist[hk(k)]=s.hist[k];
  const fav={};for(const k in s.fav||{})fav[hk(k)]=s.fav[k];
  const lists=(s.lists||[]).map(l=>({...l,items:asMap(l.items)}));   // les lignes d'une liste : rangées par id (pas de tableau dans Firebase)
  return norm({tasks:asMap(s.tasks),shop:asMap(s.shop),events:asMap(s.events),shifts:asMap(s.shifts),profiles:asMap(s.profiles),sched:s.sched,meals,memo:{v:s.memo||'',u:s.memoU||0},hist,gone:s.gone,
    dishes:asMap(s.dishes),lists:asMap(lists),infos:asMap(s.infos),bins:asMap(s.bins),msgs:asMap(s.msgs),fav})||{};
}
function merge(a,b){
  a=a||{};b=b||{};const g={...(a.gone||{})};for(const k in b.gone||{})g[k]=Math.max(g[k]||0,b.gone[k]);
  const old=Date.now()-60*864e5;for(const k in g)if(g[k]<old)delete g[k];
  const newer=(x,y)=>!x?y:!y?x:((y.u||0)>(x.u||0)?y:x);
  const lst=n=>{const o={...(a[n]||{})};for(const k in b[n]||{})o[k]=newer(o[k],b[n][k]);for(const k in o)if(g[k]!==undefined&&g[k]>=(o[k].u||0))delete o[k];return o};
  const meals={...(a.meals||{})};for(const k in b.meals||{})meals[k]=newer(meals[k],b.meals[k]);
  const hist={...(a.hist||{})};for(const k in b.hist||{})hist[k]=Math.max(hist[k]||0,b.hist[k]);
  const sched={...(a.sched||{})},so=schedMin();for(const k in b.sched||{})sched[k]=newer(sched[k],b.sched[k]);for(const k in sched)if(k<so)delete sched[k];
  const fav={...(a.fav||{})};for(const k in b.fav||{})fav[k]=newer(fav[k],b.fav[k]);
  return norm({tasks:lst('tasks'),shop:lst('shop'),events:lst('events'),shifts:lst('shifts'),profiles:lst('profiles'),sched,meals,memo:newer(a.memo,b.memo),hist,gone:g,
    dishes:lst('dishes'),lists:lst('lists'),infos:lst('infos'),bins:lst('bins'),msgs:lst('msgs'),fav})||{};
}
function unpack(m){
  const vals=o=>Object.values(o||{}).sort((x,y)=>x.id<y.id?-1:1);
  st.tasks=vals(m.tasks).map(t=>({done:null,...t}));st.shop=vals(m.shop).map(i=>({done:false,...i}));st.events=vals(m.events).map(e=>({time:'',yearly:false,...e}));
  st.meals={};st.mu={};for(const k in m.meals||{}){const d=k[0],t=k[1];st.mu[k]=m.meals[k].u||0;if(m.meals[k].v)(st.meals[d]=st.meals[d]||{})[t]=m.meals[k].v}
  st.memo=(m.memo&&m.memo.v)||'';st.memoU=(m.memo&&m.memo.u)||0;
  st.hist={};for(const k in m.hist||{})st.hist[decodeURIComponent(k.slice(1))]=m.hist[k];
  st.shifts=vals(m.shifts);st.profiles=vals(m.profiles);st.sched=m.sched||{};applyMine();
  st.dishes=vals(m.dishes);st.infos=vals(m.infos);st.bins=vals(m.bins);st.msgs=vals(m.msgs);
  st.lists=vals(m.lists).map(l=>({...l,items:Object.values(l.items||{}).sort((x,y)=>(x.o||0)-(y.o||0))}));
  st.fav={};for(const k in m.fav||{})st.fav[decodeURIComponent(k.slice(1))]=m.fav[k];
  st.gone=m.gone||{};
}
const famURL=()=>FB+'/familles/'+FAM+'.json';
let syncing=false,again=false,syncOK=null,needR=false;
function setSy(t){syncOK=t;const e=$('#sy');if(e)e.textContent=t==='ok'?'☁️ partagé':t==='err'?'⚠️ hors ligne':'☁️ …'}
async function sync(){
  if(syncing){again=true;return}syncing=true;
  try{
    const r=await fetch(famURL(),{cache:'no-store'});if(!r.ok)throw r.status;
    const remote=norm(await r.json())||{},local=pack(st),m=merge(local,remote),ms=JSON.stringify(m);
    if(ms!==JSON.stringify(remote)){const w=await fetch(famURL(),{method:'PUT',body:ms});if(!w.ok)throw w.status}
    // Ce qui a été ajouté pendant l'envoi est gardé (sinon perdu) ; le prochain envoi s'en charge.
    const now=pack(st),m2=JSON.stringify(now)===JSON.stringify(local)?m:merge(now,m);
    if(JSON.stringify(m2)!==JSON.stringify(now)){unpack(m2);tidy();softRender()}
    setSy('ok');if(!st.me&&!whoAsked&&!$('#ins').classList.contains('on')&&!$('#sh').classList.contains('on')){whoAsked=true;setTimeout(whoSheet,400)}
  }catch(e){setSy('err')}
  syncing=false;if(again){again=false;sync()}
}
const typing=()=>{const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&!$('#sh').contains(a)};
function softRender(){const a=document.activeElement;if(a&&a.id==='ni'){const v=a.value;render();const n=$('#ni');if(n){n.value=v;n.focus()}return}if(typing())needR=true;else render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(needR&&!typing()){needR=false;render()}},250));
// Écoute en direct : dès que l'autre téléphone change quelque chose, on récupère.
let es=null,esT;
function startStream(){stopStream();if(!window.EventSource)return;
  try{es=new EventSource(famURL());const on=()=>{clearTimeout(esT);esT=setTimeout(sync,300)};es.addEventListener('put',on);es.addEventListener('patch',on)}catch(e){}}
function stopStream(){if(es){es.close();es=null}}
function shareBlock(){
  return `<div class="lbl">👫 Partage ${syncOK==='ok'?'actif ✅':syncOK==='err'?'(pas de connexion) ⚠️':''}</div>
    <p class="mut">Tout le monde qui ouvre Céline voit les mêmes listes. Pour l'installer sur un autre téléphone, envoie le lien.</p>
    <div class="row"><button class="btn" onclick="sendApp()">📤 Envoyer le lien de l'appli</button></div>`;
}
function sendApp(){const u=location.origin+location.pathname,txt='🌸 Notre appli Céline (courses, ménage, repas, agenda) : '+u;
  if(navigator.share)navigator.share({text:txt}).catch(()=>{});else navigator.clipboard.writeText(u).then(()=>toast('Lien copié 📋'),()=>prompt('Copie ce lien :',u))}
setSy('');startStream();sync();

// ---------- Notifications d'anniversaire ----------
// Le téléphone s'abonne (Web Push) ; l'abonnement est rangé dans FB/familles/FAM-push/.
// Chaque matin, GitHub Actions (scripts/anniversaires.js) lit l'agenda et envoie la notification.
// La clé d'envoi est fabriquée par le premier téléphone qui active les notifications
// et rangée dans FB/familles/FAM-pushkey (rien à configurer).
const keyURL=FB+'/familles/'+FAM+'-pushkey.json';
const b64e=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function pushKey(){
  let k=await (await fetch(keyURL,{cache:'no-store'})).json();
  if(k&&k.pub&&k.priv)return k.pub;
  const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign']);
  const pub=b64e(await crypto.subtle.exportKey('raw',kp.publicKey)),priv=(await crypto.subtle.exportKey('jwk',kp.privateKey)).d;
  await fetch(keyURL,{method:'PUT',body:JSON.stringify({pub,priv,t:Date.now()})});
  k=await (await fetch(keyURL,{cache:'no-store'})).json();return k.pub;  // si l'autre téléphone a été plus rapide, on prend la sienne
}
const pushURL=id=>FB+'/familles/'+FAM+'-push/'+id+'.json';
const notifOK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
function b64u(s){const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
function hashStr(s){let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)}
async function notifOn(){
  if(isIOS&&!standalone()){toast('Installe d\'abord Céline sur l\'écran d\'accueil 📲');closeSheet();showIns(1);return}
  if(!notifOK()){toast('Ce téléphone ne permet pas les notifications 😕');return}
  try{
    const p=await Notification.requestPermission();if(p!=='granted'){toast('Notifications refusées. Autorise-les dans les réglages du téléphone.');return}
    const reg=await navigator.serviceWorker.ready;
    const pub=await pushKey();let sub=await reg.pushManager.getSubscription();
    if(sub&&(!sub.options.applicationServerKey||b64e(sub.options.applicationServerKey)!==pub)){await sub.unsubscribe();sub=null}
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(pub)});
    const j=sub.toJSON(),r=await fetch(pushURL(hashStr(j.endpoint)),{method:'PUT',body:JSON.stringify({endpoint:j.endpoint,keys:j.keys,name:st.name||'',me:st.me||'',t:Date.now()})});
    if(!r.ok)throw r.status;
    st.notif=1;saveLocal();toast('🔔 Notifications activées !');settings();
  }catch(e){toast('Impossible d\'activer les notifications, réessaie plus tard')}
}
async function notifOff(){
  try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
    if(sub){await fetch(pushURL(hashStr(sub.endpoint)),{method:'DELETE'}).catch(()=>{});await sub.unsubscribe()}}catch(e){}
  st.notif=0;saveLocal();toast('🔕 Notifications coupées');settings();
}
function notifBlock(){
  const on=st.notif&&notifOK()&&Notification.permission==='granted';
  return `<div class="lbl">🔔 Rappels (notifications)</div>
    <p class="mut">Un message la veille au soir (19h) et 1 heure avant chaque rendez-vous 📅, et pour les anniversaires 🎂 la veille et le jour même.</p>
    <div class="row">${on?'<button class="btn soft" onclick="notifOff()">🔕 Couper les rappels</button>':'<button class="btn" onclick="notifOn()">🔔 Activer les rappels</button>'}</div>`;
}
// Clic sur une notification : ouvrir l'agenda.
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data==='agenda'||e.data==='home')go(e.data)});
if(location.hash==='#agenda'){tab='agenda';history.replaceState(null,'',location.pathname)}
setInterval(()=>{if(!document.hidden)sync()},30000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopStream();else{startStream();sync()}});
addEventListener('online',()=>sync());
applyTheme();applyPhoto();render();setSy(syncOK);setTimeout(()=>showIns(),700);
wxLoad();document.addEventListener('visibilitychange',()=>{if(!document.hidden){wxLoad();annivConfetti()}});
// Un anniversaire aujourd'hui : quelques confettis, une fois par jour sur ce téléphone.
function annivConfetti(){const td=ymd(new Date());if(!upcoming().some(x=>x.n===0&&x.e.type==='anniv'))return;try{if(localStorage.getItem('celine-cf')===td)return;localStorage.setItem('celine-cf',td)}catch(e){return}setTimeout(confetti,600)}
annivConfetti();
</script>
