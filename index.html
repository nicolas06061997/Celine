const KEY='celine1';
function def(){
  let n0=0;const t=(e,n,d)=>({id:'d'+(++n0),e,t:n,day:d,rep:true,done:null,u:0});
  return {tasks:[t('🧺','Faire une lessive',0),t('🧹','Passer l\'aspirateur',2),t('🗑️','Sortir les poubelles',3),t('🛁','Nettoyer la salle de bain',4),t('🛏️','Changer les draps',5),t('🪴','Arroser les plantes',7)],

    shifts:SHIFT0.map((x,i)=>({id:'s'+(i+1),e:x[0],n:x[1],h:x[2],c:x[3],u:0})),sched:{},profiles:[]};
}
let st=(()=>{try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.tasks)return Object.assign(def(),s)}catch(e){}return def()})();
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function save(){saveLocal();clearTimeout(pushT);pushT=setTimeout(sync,600)}
let pushT;
const gone=id=>{st.gone[id]=Date.now()};
const who=()=>esc(st.name||'Céline');
// Nouvelle semaine : les tâches répétées repartent à zéro, les tâches uniques déjà faites disparaissent.
function tidy(){
  const wk=weekKey();
  st.tasks=st.tasks.filter(t=>{const k=t.rep||!t.done||t.done===wk;if(!k)gone(t.id);return k});
  if(st.mealWeek&&st.mealWeek!==wk&&st.mealsAuto)emptyMeals();
  st.mealWeek=wk;
  const yest=ymd(new Date(Date.now()-92*864e5));
  st.events=st.events.filter(e=>{const k=e.yearly||e.date>=yest;if(!k)gone(e.id);return k});
  const old=Date.now()-60*864e5;for(const k in st.gone)if(st.gone[k]<old)delete st.gone[k];
  const so=schedMin();for(const k in st.sched)if(k<so)delete st.sched[k];
  saveLocal();
}
const schedMin=()=>ymd(new Date(Date.now()-120*864e5));
function emptyMeals(){const n=Date.now();for(let d=0;d<7;d++)for(const k of['m','s'])st.mu[d+k]=n;st.meals={}}
tidy();
const isDone=t=>t.done===weekKey();

function ring(p,size=64){const r=size/2-6,c=2*Math.PI*r;
  return `<svg class="ring" width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--pri2)" stroke-width="7"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--pri)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-size="${size/4.2}">${Math.round(p*100)}%</text></svg>`}

function askDelTask(id){ed={id};delTask()}
function toggleTask(id){
  const t=st.tasks.find(x=>x.id===id);if(!t)return;
  t.done=isDone(t)?null:weekKey();t.u=Date.now();buzz();save();render();
  if(t.done){const list=st.tasks.filter(x=>x.day===t.day);
    if(list.every(isDone))toast(t.day===7?'Toutes les tâches de la semaine sont faites ! 🎉':'Bravo '+(st.name||'Céline')+', tout est fait pour '+DAYS[t.day].toLowerCase()+' ! 🎉');}
}

  sheet(`<h3>${id?'Modifier la tâche':'Nouvelle tâche'}</h3>
  <div class="row"><button class="chip" style="font-size:22px;padding:8px 12px" id="fe" onclick="cycEmoji()" aria-label="Changer l'image">${esc(t.e)}</button><input id="ft" value="${esc(t.t)}" placeholder="Ex : Passer l'aspirateur" ${id?'':'oninput="guessEmoji(this.value)"'}></div>

function cycEmoji(){const L=[...new Set(SUG.map(s=>s[0]))];ed.e=L[(L.indexOf(ed.e)+1)%L.length];$('#fe').textContent=ed.e}
function pickSug(i){ed.e=SUG[i][0];$('#fe').textContent=ed.e;$('#ft').value=SUG[i][1]}
function guessEmoji(v){v=v.toLowerCase();const s=SUG.find(s=>s[1].toLowerCase().split(' ').some(w=>w.length>4&&v.includes(w)));if(s){ed.e=s[0];$('#fe').textContent=s[0]}}
function setDay(i,b){ed.day=i;document.querySelectorAll('.dch').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function saveTask(){
  const n=$('#ft').value.trim();if(!n){$('#ft').focus();return}
  const rep=$('#fr').checked;
  if(ed.id){Object.assign(st.tasks.find(x=>x.id===ed.id),{t:n,e:ed.e,day:ed.day,rep,u:Date.now()})}
  else st.tasks.push({id:uid(),t:n,e:ed.e,day:ed.day,rep,done:null,u:Date.now()});
  dayF=ed.day;save();closeSheet();render();
}
function delTask(){gone(ed.id);st.tasks=st.tasks.filter(x=>x.id!==ed.id);save();closeSheet();render();toast('Tâche supprimée')}

// ---------- Courses ----------
function catOf(name){const n=' '+name.toLowerCase().replace(/['’\-]/g,' ')+' ';
  let best=CATS.length-1,len=0;
  CATS.forEach((c,i)=>c[2].split(' ').forEach(k=>{if(k&&n.includes(' '+k)&&k.length>len){best=i;len=k.length}}));
  return best}
function addItem(name){
  name=(name||'').trim();if(!name)return;
  const ex=st.shop.find(i=>i.t.toLowerCase()===name.toLowerCase());
  if(ex){ex.done=false;ex.u=Date.now()}else st.shop.push({id:uid(),t:name,c:catOf(name),done:false,u:Date.now()});
  const k=name.toLowerCase();st.hist[k]=(st.hist[k]||0)+1;
  buzz();save();render();
  const i=$('#ni');if(i){i.focus()}
}
function toggleItem(id){const i=st.shop.find(x=>x.id===id);i.done=!i.done;i.u=Date.now();buzz();save();render()}
function delItem(id){gone(id);st.shop=st.shop.filter(x=>x.id!==id);save();render()}
function clearTaken(){st.shop=st.shop.filter(x=>{if(x.done)gone(x.id);return !x.done});save();render();toast('Articles pris retirés 🧺')}
function shareList(){
  const left=st.shop.filter(i=>!i.done);if(!left.length){toast('La liste est vide');return}
  let txt='🛒 Liste de courses\n';
  CATS.forEach((c,ci)=>{const l=left.filter(i=>i.c===ci);if(l.length)txt+='\n'+c[1]+' '+c[0]+'\n'+l.map(i=>'• '+i.t).join('\n')+'\n'});
  if(navigator.share)navigator.share({text:txt}).catch(()=>{});
  else navigator.clipboard.writeText(txt).then(()=>toast('Liste copiée 📋'),()=>toast('Impossible de copier'));
}

const TYPES=[['rdv','📅','Rendez-vous'],['anniv','🎂','Anniversaire'],['ecole','🎒','École'],['sante','🩺','Santé'],['autre','⭐','Autre']];
function nextOcc(e){
  const t=day0(new Date());
  const [y,m,d]=e.date.split('-').map(Number);
  let dt=new Date(y,m-1,d);
  if(e.yearly){dt=new Date(t.getFullYear(),m-1,d);if(dt<t)dt=new Date(t.getFullYear()+1,m-1,d)}
  return {dt,n:Math.round((dt-t)/864e5),age:e.type==='anniv'&&y>1900&&y<t.getFullYear()?dt.getFullYear()-y:0};
}
function upcoming(){return st.events.map(e=>({e,...nextOcc(e)})).filter(x=>x.n>=-1).sort((a,b)=>a.n-b.n||(a.e.time||'').localeCompare(b.e.time||''))}
function when(n){return n<-1?'Il y a '+(-n)+' jours':n<0?'Hier':n===0?'Aujourd\'hui !':n===1?'Demain':'Dans '+n+' jours'}
function evRow(x){const ty=TYPES.find(t=>t[0]===x.e.type)||TYPES[4];
  return `<div class="ev" onclick="evSheet('${x.e.id}')"><div class="d"><b>${x.dt.getDate()}</b><span>${MOIS[x.dt.getMonth()]}</span></div>

  <div class="mut">${x.e.time?'🕐 '+esc(x.e.time)+' · ':''}<span class="tag ${x.n<=1?'now':''}">${when(x.n)}</span></div></div></div>`}

  const e=id?st.events.find(x=>x.id===id):{t:'',date:(tab==='agenda'&&calSel)||ymd(new Date()),time:'',type:'rdv',yearly:false};

// ---------- Calendrier ----------
let calM=null,calSel=null,calX=null;
// Jour du mois m (0-11) de l'année y où tombe l'événement, sinon 0.
function occOn(e,y,m){const [ey,em,ed]=e.date.split('-').map(Number);return (e.yearly||ey===y)&&em-1===m&&ed<=new Date(y,m+1,0).getDate()?ed:0}
function calMove(k){calM=new Date(calM.getFullYear(),calM.getMonth()+k,1);render()}
function calPick(k){if(paint){setSched(k,paint==='x'||shiftOn(k)&&shiftOn(k).id===paint?'':paint);buzz();render();return}if(k===calSel){evSheet();return}calSel=k;render()}
// Horaire : st.sched[date]={v:id du type,u}
let paint=null,pat=null;
const shiftOn=k=>{const e=st.sched[k]||{},t=e.v&&st.shifts.find(x=>x.id===e.v);return t?{...t,h:e.h||t.h}:null};
// Horaire d'un jour précis, avec ses propres heures (ex. 8h – 17h)
const hm=v=>{if(!v)return '';const [h,m]=v.split(':');return (+h)+'h'+(m!=='00'?m:'')};
const toHM=t=>{const m=(t||'').match(/(\d{1,2})\s*[h:]\s*(\d{2})?/);return m?String(m[1]).padStart(2,'0')+':'+(m[2]||'00'):''};
function setSched(k,v){st.sched[k]={v,u:Date.now()};save()}
const shLabel=x=>x?`${esc(x.e)} ${esc(x.n)}${x.h?' · '+esc(x.h):''}`:'';
function paintMode(on){paint=on?(paint||(st.shifts[0]||{}).id||'x'):null;render();if(on)window.scrollTo(0,0)}
function paintPick(id){paint=id;render()}
// Heures de base d'un type (« 8h – 17h ») → ['08:00','17:00']
const typeHM=id=>{const x=st.shifts.find(s=>s.id===id);const [a,b]=((x&&x.h)||'').split(/[–-]/);return [toHM(a),toHM(b)]};
const hRange=(a,b)=>a||b?hm(a)+(b?' – '+hm(b):''):'';
// N'enregistre des heures propres au jour que si elles diffèrent des heures de base du type.
function schedVal(v,a,b,now){const [ta,tb]=typeHM(v),o={v,u:now};if((a||b)&&(a!==ta||b!==tb))o.h=hRange(a,b);return o}
function daySheet(k,keep){
  const e=st.sched[k]||{};
  ed={k,v:e.v||(st.shifts[1]||st.shifts[0]||{}).id||''};if(keep)ed.v=keep;
  let [a,b]=typeHM(ed.v);if(!keep&&e.h){const [x,y]=e.h.split(/[–-]/);a=toHM(x);b=toHM(y)}
  const [y,m,d]=k.split('-').map(Number);
  sheet(`<h3>💼 ${new Date(y,m-1,d).toLocaleDateString('fr-BE',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase())}</h3>
  <div class="lbl">Quel genre de journée ?</div><div class="chips wrap">${st.shifts.map(x=>`<button class="chip ${ed.v===x.id?'on':''}" style="${ed.v===x.id?'':'background:'+x.c+';color:#4a3940'}" onclick="daySheet(ed.k,'${x.id}')">${esc(x.e)} ${esc(x.n)}</button>`).join('')}</div>
  <div class="lbl">Heures</div>
  <div class="row"><span>De</span><input type="time" id="dh1" value="${a}"><span>à</span><input type="time" id="dh2" value="${b}"></div>
  <p class="mut">Les heures habituelles sont déjà mises. Change-les seulement si ce jour-là est différent.</p>

function applyPat(){

function repeatSheet(){

  const t=new Date(),end=new Date(t.getFullYear(),11,31);

function doRepeat(){
  const [y,m,d]=$('#rf').value.split('-').map(Number),mon=new Date(y,m-1,d);mon.setDate(mon.getDate()-(mon.getDay()+6)%7);
  const L=$('#r2').checked?14:7,to=$('#rt').value,src=[];
  for(let i=0;i<L;i++){const x=new Date(mon);x.setDate(mon.getDate()+i);src.push(st.sched[ymd(x)]||{})}
  if(!src.some(x=>x.v)){toast('Cette semaine est vide : remplis-la d\'abord');return}
  const now=Date.now(),x=new Date(mon);x.setDate(mon.getDate()+L);let n=0,i=0;
  while(ymd(x)<=to&&i<800){const c=src[i%L];if(c.v){st.sched[ymd(x)]={v:c.v,u:now,...(c.h?{h:c.h}:{})};n++}x.setDate(x.getDate()+1);i++}
  save();closeSheet();render();toast(n+' jours recopiés ✨');
}

// st.col = couleur choisie (hex) ou 'rose' (style d'origine) ; st.motif = 'fleurs' | 'formes' | 'uni'.
const PALETTE=[['Rose','rose'],['Framboise','#d6336c'],['Corail','#ec6a5c'],['Pêche','#e0844f'],['Or','#c08a12'],['Sauge','#4f8a6b'],['Menthe','#2a9d8f'],['Turquoise','#1c93a8'],['Ciel','#3a86c8'],['Marine','#2f4f8f'],['Lavande','#8a6fd1'],['Violet','#6b3fa0'],['Chocolat','#8b5e3c'],['Ardoise','#4a5568'],['Noir','#2b2b2b']];
const OLDTH={bleu:'#3b6fb6',vert:'#4f8a6b',ardoise:'#4a5568'};
if(st.theme&&!st.col){st.col=OLDTH[st.theme]||'rose';st.motif=st.theme==='rose'?'fleurs':'formes';delete st.theme;saveLocal()}
const colOf=()=>st.col||'rose',motOf=()=>st.motif||'fleurs';
const TH=()=>{const m=motOf();return {hi:m==='fleurs'?'🌸':'👋',sym:m==='fleurs'?'✿':'✦',neutral:m!=='fleurs'}};
// Petits calculs de couleurs
const rgb=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const hex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const x=rgb(a),y=rgb(b);return hex(x.map((v,i)=>v+(y[i]-v)*t))};
const lum=h=>{const [r,g,b]=rgb(h);return (0.299*r+0.587*g+0.114*b)/255};
const hue=h=>{const [r,g,b]=rgb(h).map(v=>v/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;if(!d)return 0;let x=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;return (x*60+360)%360};
// Motifs en SVG
const svgURL=g=>'url("data:image/svg+xml,'+encodeURIComponent(g)+'")';
function flower(cx,cy,r,pe,ce,rot){let g=`<g transform="translate(${cx} ${cy}) rotate(${rot})">`;for(let k=0;k<5;k++)g+=`<ellipse cx="0" cy="${-r*.62}" rx="${r*.42}" ry="${r*.62}" fill="${pe}" transform="rotate(${k*72})"/>`;return g+`<circle r="${r*.3}" fill="${ce}"/></g>`}
const leaf=(cx,cy,l,rot,c)=>`<path d="M0 0 Q${l/2} ${-l*.35} ${l} 0 Q${l/2} ${l*.35} 0 0Z" fill="${c}" transform="translate(${cx} ${cy}) rotate(${rot})"/>`;
const heart=(cx,cy,z,c)=>`<path d="M0 ${z*.3} C${-z*.9} ${-z*.3} ${-z*.35} ${-z*.95} 0 ${-z*.35} C${z*.35} ${-z*.95} ${z*.9} ${-z*.3} 0 ${z*.3}Z" fill="${c}" transform="translate(${cx} ${cy})"/>`;
const dots=c=>[[100,30,2.5],[200,92,2],[30,118,2.2],[150,110,1.8],[70,220,2],[225,170,2.4],[120,160,1.6]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`).join('');
function flowerTile([p1,p2,p3,ce,lf,ht,dt]){return svgURL('<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">'+leaf(52,62,26,-35,lf)+leaf(40,50,22,200,lf)+flower(50,48,22,p1,ce,10)+leaf(178,150,24,30,lf)+flower(172,142,16,p2,ce,30)+flower(118,206,11,p3,ce,0)+flower(214,30,9,p2,ce,20)+flower(18,170,8,p3,ce,40)+heart(140,70,9,ht)+heart(84,128,6,ht)+heart(226,214,7,ht)+dots(dt)+'</svg>')}
function geoTile([a,b,d]){let g='<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240"><g fill="none" stroke-width="3" stroke-linecap="round">';
  g+=`<circle cx="48" cy="52" r="16" stroke="${a}"/><rect x="160" y="132" width="26" height="26" rx="7" stroke="${b}" transform="rotate(18 173 145)"/><circle cx="196" cy="34" r="8" stroke="${b}"/>`;
  g+=`<path d="M112 196l10 -16l10 16z" stroke="${a}" stroke-linejoin="round"/><path d="M128 64h14M135 57v14" stroke="${b}"/><path d="M28 168h12M34 162v12" stroke="${a}"/><path d="M208 210l14 -14" stroke="${d}"/><path d="M80 120l14 -14" stroke="${d}"/></g>`;
  return svgURL(g+dots(a)+'</svg>')}
const HERO_FL=svgURL('<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">'+leaf(70,96,30,20,'rgba(255,255,255,.25)')+flower(84,52,34,'rgba(255,255,255,.28)','rgba(255,240,200,.55)',15)+flower(28,104,16,'rgba(255,255,255,.22)','rgba(255,240,200,.5)',40)+flower(124,118,11,'rgba(255,255,255,.2)','rgba(255,240,200,.5)',0)+'</svg>');
const HERO_GEO=svgURL('<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150"><g fill="none" stroke="rgba(255,255,255,.28)" stroke-width="10"><circle cx="100" cy="50" r="38"/></g><g fill="none" stroke="rgba(255,255,255,.2)" stroke-width="6"><circle cx="40" cy="112" r="18"/><rect x="112" y="104" width="24" height="24" rx="6" transform="rotate(20 124 116)"/></g></svg>');
function applyTheme(){
  const el=$('#thm')||document.head.appendChild(Object.assign(document.createElement('style'),{id:'thm'}));
  const m=motOf(),t=TH();$('#hsym').textContent=t.sym;
  const meta=document.querySelector('meta[name=theme-color]');

  let c=colOf()==='rose'?'#e8779c':colOf();while(lum(c)>.6)c=mix(c,'#000000',.12);                    // assez foncé pour le texte blanc
  if(meta)meta.content=c;
  const W='#ffffff',K='#121214',hu=hue(c),warm=hu<50||hu>320;
  const aA=warm?'#9d7bf0':'#ffa26b',aB=warm?'#6a4fd6':'#ef6f3c';

  const D={pri:mix(c,W,.3),pri2:mix(c,K,.58),pri3:mix(c,K,.8),bg:mix(c,K,.9),card:mix(c,'#1e1e22',.86)};
  const pat=(dk)=>m==='uni'?'none':m==='fleurs'
    ?(dk?flowerTile([mix(c,K,.6),mix(c,K,.55),mix(c,K,.68),'#6b5530','#2f3d33',mix(c,K,.5),mix(c,K,.62)]):flowerTile([mix(c,W,.72),mix(c,W,.64),mix(c,W,.82),'#f7d58a','#d5e8d4',mix(c,W,.56),mix(c,W,.68)]))
    :(dk?geoTile([mix(c,K,.72),mix(c,K,.64),mix(c,K,.8)]):geoTile([mix(c,W,.7),mix(c,W,.6),mix(c,W,.8)]));
  const v=(o,dk)=>`--pri:${o.pri};--pri2:${o.pri2};--pri3:${o.pri3};--bg:${o.bg};${o.card?'--card:'+o.card+';':''}--pat:${pat(dk)};--line:${o.pri2};--sh:0 4px 18px ${c}22`;
  el.textContent=`:root:root{${v(L)}}
@media (prefers-color-scheme:dark){:root:root{${v(D,1)};--ink:#f1eef2;--mut:#a39ca6}}
.hero{background:${m==='fleurs'?HERO_FL+' right -18px top -22px/150px':m==='formes'?HERO_GEO+' right -18px top -22px/150px':'none'} no-repeat,linear-gradient(135deg,${mix(c,W,.3)},${mix(c,'#000000',.15)})}
.alert{background:linear-gradient(135deg,${aA},${aB});box-shadow:0 8px 24px ${aB}55}

#ins{background:linear-gradient(160deg,${L.pri2},${L.bg} 55%)}#ins .st .num{background:${c}}#ins .st{box-shadow:0 4px 18px ${c}26}`;
}

function applyPhoto(){
  const on=!!bgPhoto;document.documentElement.classList.toggle('has-ph',on);

  if(!el.firstChild)el.innerHTML='<i></i><b></b>';

// Réduit la photo (max 1400 px) et la compresse pour qu'elle reste légère.
function pickPhoto(inp){
  const f=inp.files&&inp.files[0];if(!f)return;inp.value='';toast('Photo en préparation…');
  const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{const k=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    let q=.82,d=c.toDataURL('image/jpeg',q);while(d.length>1.6e6&&q>.4){q-=.12;d=c.toDataURL('image/jpeg',q)}
    try{localStorage.setItem('celine-bg',d);bgPhoto=d;applyPhoto();photoUp();colorSheet();toast('Photo de fond mise 📷')}
    catch(e){toast('Photo trop lourde pour ce téléphone, essaie une autre')}};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Impossible de lire cette photo')};
  img.src=url;
}

    ${step(1,'Touche <b>⋯</b> ou <b>⬆️</b> (en haut ou en bas de l\'écran)')}${step(2,'Choisis <b>« Ouvrir dans Safari »</b> 🧭')}
    <button class="btn soft" onclick="copyLink()">📋 Copier le lien</button>`;
  if(inApp()&&isAndroid)return `<h2>Encore une petite étape 🌸</h2><p>Le lien s'est ouvert dans <b>${appName()}</b>. Pour installer Céline, il faut l'ouvrir dans <b>Chrome</b>.</p>
    <button class="btn" onclick="openChrome()">🌐 Ouvrir dans Chrome</button>
    ${step(1,'Sinon : touche <b>⋮</b> en haut à droite')}${step(2,'Choisis <b>« Ouvrir dans Chrome »</b>')}`;
  if(dp)return `<h2>Installe Céline 🌸</h2><p>Elle sera sur ton écran d'accueil, comme une vraie application.</p><button class="btn" onclick="install()">📲 Installer</button>`;
  if(isIOS)return `<h2>Installe Céline 🌸</h2><p>3 petites étapes et elle sera sur ton écran d'accueil, comme une vraie application :</p>
    ${step(1,iosOther()?'Touche le bouton <b>Partager ⬆️</b> (dans la barre d\'adresse)':'Touche le bouton <b>Partager ⬆️</b> en bas de l\'écran<br><span class="mut">(ou <b>⋯</b> en bas à droite, puis <b>Partager</b>)</span>')}
    ${step(2,'Fais défiler et touche <b>« Sur l\'écran d\'accueil »</b> ➕')}
    ${step(3,'Touche <b>« Ajouter »</b> en haut à droite')}
    <p class="mut">Ensuite, ouvre Céline depuis l'icône rose sur ton écran 🌸</p>${iosOther()?'':'<div class="arrow">⬇️</div>'}`;
  if(isAndroid)return `<h2>Installe Céline 🌸</h2>${step(1,'Touche <b>⋮</b> en haut à droite de Chrome')}${step(2,'Choisis <b>« Installer l\'application »</b> ou <b>« Ajouter à l\'écran d\'accueil »</b>')}
    <button class="btn soft" onclick="openChrome()">🌐 Pas dans le menu ? Ouvrir dans Chrome</button>`;
  return `<h2>Céline 🌸</h2><p>Ouvre ce lien sur ton téléphone pour installer Céline.</p><button class="btn soft" onclick="copyLink()">📋 Copier le lien</button>`;
}
function showIns(force){if(standalone())return;
  if(!force){try{if(Date.now()-(+localStorage.getItem('celine-ins')||0)<864e5)return}catch(e){}}
  $('#insc').innerHTML=insHTML();$('#ins').classList.add('on')}
function hideIns(){$('#ins').classList.remove('on')}
function insLater(){try{localStorage.setItem('celine-ins',Date.now())}catch(e){}hideIns()}
function installHelp(){return standalone()?'Céline est déjà installée sur ton écran d\'accueil ✅':'<button class="btn soft" onclick="closeSheet();showIns(1)">📲 Comment installer Céline</button>'}
function installBanner(){if(standalone()||st.noBanner)return '';
  return `<div class="card" style="display:flex;gap:12px;align-items:center" onclick="showIns(1)"><span style="font-size:30px">📲</span><div style="flex:1"><b>Installe Céline</b><div class="mut">Touche ici pour voir comment</div></div><button class="x" onclick="event.stopPropagation();st.noBanner=1;saveLocal();render()">✕</button></div>`}

// Au retour sur l'appli (le lendemain, nouvelle semaine…), tout se remet à jour.
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tidy();if(!$('#sh').classList.contains('on')&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){dayF=tab==='menage'?dayF:todayI();render()}}});

// Version de l'appli : à changer à chaque mise à jour, avec la même valeur dans version.json.
const APPV='2026-11-01.9';
let SWR=null;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v='+APPV).then(r=>{SWR=r}).catch(()=>{});
// Nouvelle version publiée ? On affiche « Nouvelle mise à jour disponible ».
function chkV(man){if(SWR)SWR.update().catch(()=>{});
  fetch('version.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
    if(!j||!j.v||j.v===APPV){if(man)toast('Céline est à jour ✓');return}
    // Mise à jour automatique : on recharge tout de suite, sauf si on est en train d'écrire ou qu'une fenêtre est ouverte.
    // (Une seule tentative par version, pour ne jamais boucler.)
    let tried='';try{tried=localStorage.getItem('celine-auto')||''}catch(x){}
    const busy=$('#sh').classList.contains('on')||['INPUT','TEXTAREA'].includes((document.activeElement||{}).tagName);
    if(tried!==j.v&&!busy){try{localStorage.setItem('celine-auto',j.v)}catch(x){}
      (SWR?SWR.update().catch(()=>{}):Promise.resolve()).then(()=>location.reload());return}
    if(man)closeSheet();$('#updn').textContent=j.notes||'';$('#upd').classList.add('on')}).catch(()=>{if(man)toast('Pas de connexion')})}
try{const o=localStorage.getItem('celine-v');localStorage.setItem('celine-v',APPV);if(o&&o!==APPV)setTimeout(()=>toast('Céline a été mise à jour ✨'),600)}catch(e){}
chkV();setInterval(chkV,30*60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)chkV()});

// ---------- Partage entre les téléphones de la famille (Firebase Realtime Database) ----------
// Tous les téléphones qui ouvrent l'appli partagent les mêmes listes : FB/familles/FAM.json.
// Chaque élément porte sa date de modification (u) ; les suppressions sont notées dans `gone`.
// La fusion garde toujours la version la plus récente : rien ne se perd si les deux modifient en même temps.
const FB='https://celine-fcdb2-default-rtdb.europe-west1.firebasedatabase.app';
const FAM='mk4tq-zr8wd-h3pxn-97cfa';
const hk=k=>'k'+encodeURIComponent(k).replace(/\./g,'%2E');
function norm(x){
  if(x===null||x===undefined||x==='')return undefined;
  if(typeof x!=='object')return x;
  const o={};Object.keys(x).sort().forEach(k=>{const v=norm(x[k]);if(v!==undefined&&!(typeof v==='object'&&!Object.keys(v).length))o[k]=v});return o;
}
const asMap=a=>{const o={};(a||[]).forEach(x=>{if(x&&x.id)o[x.id]=x});return o};
function pack(s){
  const meals={};for(let d=0;d<7;d++)for(const k of['m','s']){const u=s.mu[d+k]||0,v=(s.meals[d]||{})[k]||'';if(u||v)meals[d+k]={v,u}}
  const hist={};for(const k in s.hist)hist[hk(k)]=s.hist[k];
  return norm({tasks:asMap(s.tasks),shop:asMap(s.shop),events:asMap(s.events),shifts:asMap(s.shifts),profiles:asMap(s.profiles),sched:s.sched,meals,memo:{v:s.memo||'',u:s.memoU||0},hist,gone:s.gone})||{};
}
function merge(a,b){
  a=a||{};b=b||{};const g={...(a.gone||{})};for(const k in b.gone||{})g[k]=Math.max(g[k]||0,b.gone[k]);
  const old=Date.now()-60*864e5;for(const k in g)if(g[k]<old)delete g[k];
  const newer=(x,y)=>!x?y:!y?x:((y.u||0)>(x.u||0)?y:x);
  const lst=n=>{const o={...(a[n]||{})};for(const k in b[n]||{})o[k]=newer(o[k],b[n][k]);for(const k in o)if(g[k]!==undefined&&g[k]>=(o[k].u||0))delete o[k];return o};
  const meals={...(a.meals||{})};for(const k in b.meals||{})meals[k]=newer(meals[k],b.meals[k]);
  const hist={...(a.hist||{})};for(const k in b.hist||{})hist[k]=Math.max(hist[k]||0,b.hist[k]);
  const sched={...(a.sched||{})},so=schedMin();for(const k in b.sched||{})sched[k]=newer(sched[k],b.sched[k]);for(const k in sched)if(k<so)delete sched[k];
  return norm({tasks:lst('tasks'),shop:lst('shop'),events:lst('events'),shifts:lst('shifts'),profiles:lst('profiles'),sched,meals,memo:newer(a.memo,b.memo),hist,gone:g})||{};
}
function unpack(m){
  const vals=o=>Object.values(o||{}).sort((x,y)=>x.id<y.id?-1:1);
  st.tasks=vals(m.tasks).map(t=>({done:null,...t}));st.shop=vals(m.shop).map(i=>({done:false,...i}));st.events=vals(m.events).map(e=>({time:'',yearly:false,...e}));
  st.meals={};st.mu={};for(const k in m.meals||{}){const d=k[0],t=k[1];st.mu[k]=m.meals[k].u||0;if(m.meals[k].v)(st.meals[d]=st.meals[d]||{})[t]=m.meals[k].v}
  st.memo=(m.memo&&m.memo.v)||'';st.memoU=(m.memo&&m.memo.u)||0;
  st.hist={};for(const k in m.hist||{})st.hist[decodeURIComponent(k.slice(1))]=m.hist[k];
  st.shifts=vals(m.shifts);st.profiles=vals(m.profiles);st.sched=m.sched||{};applyMine();
  st.gone=m.gone||{};
}
const famURL=()=>FB+'/familles/'+FAM+'.json';
let syncing=false,again=false,syncOK=null,needR=false;
function setSy(t){syncOK=t;const e=$('#sy');if(e)e.textContent=t==='ok'?'☁️ partagé':t==='err'?'⚠️ hors ligne':'☁️ …'}
async function sync(){
  if(syncing){again=true;return}syncing=true;
  try{
    const r=await fetch(famURL(),{cache:'no-store'});if(!r.ok)throw r.status;
    const remote=norm(await r.json())||{},local=pack(st),m=merge(local,remote),ms=JSON.stringify(m);
    if(ms!==JSON.stringify(remote)){const w=await fetch(famURL(),{method:'PUT',body:ms});if(!w.ok)throw w.status}
    // Ce qui a été ajouté pendant l'envoi est gardé (sinon perdu) ; le prochain envoi s'en charge.
    const now=pack(st),m2=JSON.stringify(now)===JSON.stringify(local)?m:merge(now,m);
    if(JSON.stringify(m2)!==JSON.stringify(now)){unpack(m2);tidy();softRender()}
    setSy('ok');if(!st.me&&!whoAsked&&!$('#ins').classList.contains('on')&&!$('#sh').classList.contains('on')){whoAsked=true;setTimeout(whoSheet,400)}
  }catch(e){setSy('err')}
  syncing=false;if(again){again=false;sync()}
}
const typing=()=>{const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&!$('#sh').contains(a)};
function softRender(){const a=document.activeElement;if(a&&a.id==='ni'){const v=a.value;render();const n=$('#ni');if(n){n.value=v;n.focus()}return}if(typing())needR=true;else render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(needR&&!typing()){needR=false;render()}},250));
// Écoute en direct : dès que l'autre téléphone change quelque chose, on récupère.
let es=null,esT;
function startStream(){stopStream();if(!window.EventSource)return;
  try{es=new EventSource(famURL());const on=()=>{clearTimeout(esT);esT=setTimeout(sync,300)};es.addEventListener('put',on);es.addEventListener('patch',on)}catch(e){}}
function stopStream(){if(es){es.close();es=null}}
function shareBlock(){
  return `<div class="lbl">👫 Partage ${syncOK==='ok'?'actif ✅':syncOK==='err'?'(pas de connexion) ⚠️':''}</div>
    <p class="mut">Tout le monde qui ouvre Céline voit les mêmes listes. Pour l'installer sur un autre téléphone, envoie le lien.</p>
    <div class="row"><button class="btn" onclick="sendApp()">📤 Envoyer le lien de l'appli</button></div>`;
}
function sendApp(){const u=location.origin+location.pathname,txt='🌸 Notre appli Céline (courses, ménage, repas, agenda) : '+u;
  if(navigator.share)navigator.share({text:txt}).catch(()=>{});else navigator.clipboard.writeText(u).then(()=>toast('Lien copié 📋'),()=>prompt('Copie ce lien :',u))}
setSy('');startStream();sync();

// ---------- Notifications d'anniversaire ----------
// Le téléphone s'abonne (Web Push) ; l'abonnement est rangé dans FB/familles/FAM-push/.
// Chaque matin, GitHub Actions (scripts/anniversaires.js) lit l'agenda et envoie la notification.
// La clé d'envoi est fabriquée par le premier téléphone qui active les notifications
// et rangée dans FB/familles/FAM-pushkey (rien à configurer).
const keyURL=FB+'/familles/'+FAM+'-pushkey.json';
const b64e=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function pushKey(){
  let k=await (await fetch(keyURL,{cache:'no-store'})).json();
  if(k&&k.pub&&k.priv)return k.pub;
  const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign']);
  const pub=b64e(await crypto.subtle.exportKey('raw',kp.publicKey)),priv=(await crypto.subtle.exportKey('jwk',kp.privateKey)).d;
  await fetch(keyURL,{method:'PUT',body:JSON.stringify({pub,priv,t:Date.now()})});
  k=await (await fetch(keyURL,{cache:'no-store'})).json();return k.pub;  // si l'autre téléphone a été plus rapide, on prend la sienne
}
const pushURL=id=>FB+'/familles/'+FAM+'-push/'+id+'.json';
const notifOK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
function b64u(s){const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
function hashStr(s){let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)}
async function notifOn(){
  if(isIOS&&!standalone()){toast('Installe d\'abord Céline sur l\'écran d\'accueil 📲');closeSheet();showIns(1);return}
  if(!notifOK()){toast('Ce téléphone ne permet pas les notifications 😕');return}
  try{
    const p=await Notification.requestPermission();if(p!=='granted'){toast('Notifications refusées. Autorise-les dans les réglages du téléphone.');return}
    const reg=await navigator.serviceWorker.ready;
    const pub=await pushKey();let sub=await reg.pushManager.getSubscription();
    if(sub&&(!sub.options.applicationServerKey||b64e(sub.options.applicationServerKey)!==pub)){await sub.unsubscribe();sub=null}
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(pub)});
    const j=sub.toJSON(),r=await fetch(pushURL(hashStr(j.endpoint)),{method:'PUT',body:JSON.stringify({endpoint:j.endpoint,keys:j.keys,name:st.name||'',t:Date.now()})});
    if(!r.ok)throw r.status;
    st.notif=1;saveLocal();toast('🔔 Notifications activées !');settings();
  }catch(e){toast('Impossible d\'activer les notifications, réessaie plus tard')}
}
async function notifOff(){
  try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
    if(sub){await fetch(pushURL(hashStr(sub.endpoint)),{method:'DELETE'}).catch(()=>{});await sub.unsubscribe()}}catch(e){}
  st.notif=0;saveLocal();toast('🔕 Notifications coupées');settings();
}
function notifBlock(){
  const on=st.notif&&notifOK()&&Notification.permission==='granted';
  return `<div class="lbl">🔔 Rappels (notifications)</div>
    <p class="mut">Un message la veille au soir (19h) et 1 heure avant chaque rendez-vous 📅, et pour les anniversaires 🎂 la veille et le jour même.</p>
    <div class="row">${on?'<button class="btn soft" onclick="notifOff()">🔕 Couper les rappels</button>':'<button class="btn" onclick="notifOn()">🔔 Activer les rappels</button>'}</div>`;
}
// Clic sur une notification : ouvrir l'agenda.
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data==='agenda')go('agenda')});
if(location.hash==='#agenda'){tab='agenda';history.replaceState(null,'',location.pathname)}
setInterval(()=>{if(!document.hidden)sync()},30000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopStream();else{startStream();sync()}});
addEventListener('online',()=>sync());
applyTheme();applyPhoto();render();setSy(syncOK);setTimeout(()=>showIns(),700);
</script>
