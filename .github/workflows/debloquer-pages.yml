name: Débloquer la publication du site

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Publication bloquée à annuler (commit)"
        required: true

permissions:
  pages: write
  actions: read
  contents: read

jobs:
  debloquer:
    runs-on: ubuntu-latest
    steps:
      - name: État de la publication bloquée
        run: gh api "repos/${{ github.repository }}/pages/deployments/${{ inputs.sha }}" || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Annuler la publication bloquée
        run: gh api -X POST "repos/${{ github.repository }}/pages/deployments/${{ inputs.sha }}/cancel" && echo "annulée"
        env:
          GH_TOKEN: ${{ github.token }}
