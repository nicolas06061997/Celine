name: Débloquer la publication du site

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Publication bloquée (commit)"
        required: true

permissions:
  pages: write
  deployments: write
  actions: read
  contents: read

jobs:
  debloquer:
    runs-on: ubuntu-latest
    steps:
      - name: Voir et clôturer les publications restées « en cours »
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          echo "Publication Pages :"; gh api "repos/$R/pages/deployments/${{ inputs.sha }}" || true
          gh api -X POST "repos/$R/pages/deployments/${{ inputs.sha }}/cancel" || true
          for id in $(gh api "repos/$R/deployments?environment=github-pages&per_page=30" --jq '.[].id'); do
            st=$(gh api "repos/$R/deployments/$id/statuses?per_page=1" --jq '.[0].state // "aucun"')
            sha=$(gh api "repos/$R/deployments/$id" --jq '.sha')
            echo "déploiement $id ($sha) : $st"
            if [ "$st" = "in_progress" ] || [ "$st" = "queued" ] || [ "$st" = "pending" ] || [ "$st" = "aucun" ]; then
              gh api -X POST "repos/$R/deployments/$id/statuses" -f state=error -f description="Débloqué" >/dev/null && echo "  -> clôturé"
            fi
          done
